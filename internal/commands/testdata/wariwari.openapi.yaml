  /v1/groups/{group_token}/invitations/{invitation_token}/accept:
    parameters:
      - $ref: '#/components/parameters/GroupTokenAsParent'
      - $ref: '#/components/parameters/InvitationToken'
    post:
      tags:
        - invitations
      operationId: acceptInvitation
      x-wariwari-heavy-ok: Group writes return the refreshed canonical snapshot.
      summary: Accept an invitation
      description: Accepts an invitation and links the current user to the group. Returns the group snapshot.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
