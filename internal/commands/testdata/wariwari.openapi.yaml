  /v1/groups/{group_token}/payments/{payment_token}:
    parameters:
      - $ref: '#/components/parameters/GroupTokenAsParent'
      - $ref: '#/components/parameters/PaymentToken'
    patch:
      security:
        - {}
        - bearerAuth: []
      tags:
        - payments
      operationId: updatePayment
      x-wariwari-heavy-ok: Group writes return the refreshed canonical snapshot.
      summary: Update a payment
      description: |
        Updates an existing payment. Requires the latest `lockVersion`. A deleted
        payment returns `CONFLICT` with `current` carrying its `deletedAt`, even
        when `lockVersion` matches.
      parameters:
        - $ref: '#/components/parameters/MutationOperationId'
        - $ref: '#/components/parameters/RecordedAt'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/groups/{group_token}/participants/{participant_token}/claim:
    parameters:
      - $ref: '#/components/parameters/GroupTokenAsParent'
      - $ref: '#/components/parameters/ParticipantToken'
    post:
      tags:
        - participants
      parameters:
        - $ref: '#/components/parameters/MutationOperationId'
        - $ref: '#/components/parameters/RecordedAt'
      operationId: claimParticipant
      x-wariwari-heavy-ok: Group writes return the refreshed canonical snapshot.
      summary: Claim a participant
      description: |
        Links a guest participant to the current user. When the user is already
        linked to another participant in the group, the guest is merged into that
        participant. Retries with the same operation ID replay an
        account-scoped receipt. Current group access is required before replay.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409ParticipantClaim'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/groups/{group_token}/participants/{participant_token}/merge:
    parameters:
      - $ref: '#/components/parameters/GroupTokenAsParent'
      - $ref: '#/components/parameters/ParticipantToken'
    post:
      security:
        - {}
        - bearerAuth: []
      tags:
        - participants
      parameters:
        - $ref: '#/components/parameters/MutationOperationId'
        - $ref: '#/components/parameters/RecordedAt'
        - $ref: '#/components/parameters/MutationExpectedRevision'
      operationId: mergeParticipant
      x-wariwari-heavy-ok: Group writes return the refreshed canonical snapshot.
      summary: Merge a participant
      description: |
        Merges this participant (loser) into the winner identified by `into`. Every
        transaction that named the loser gets a new `lockVersion`, so a queued edit
        still naming the loser returns `CONFLICT` with the merged transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - into
              properties:
                into:
                  allOf:
                    - $ref: '#/components/schemas/Token'
                  description: Winner participant token.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/groups/{group_token}/participants/{participant_token}/link:
    parameters:
      - $ref: '#/components/parameters/GroupTokenAsParent'
      - $ref: '#/components/parameters/ParticipantToken'
    delete:
      tags:
        - participants
      operationId: unlinkParticipant
      x-wariwari-heavy-ok: Group writes return the refreshed canonical snapshot.
      summary: Unlink the current user from a participant
      description: Unlinks the current user's participant. Blocked if it would leave a private group without an admin.
      responses:
        '200':
          description: Unlinked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/groups/{group_token}/participants/{participant_token}/position:
    parameters:
      - $ref: '#/components/parameters/GroupTokenAsParent'
      - $ref: '#/components/parameters/ParticipantToken'
    patch:
      security:
        - {}
        - bearerAuth: []
      tags:
        - participants
      parameters:
        - $ref: '#/components/parameters/MutationOperationId'
        - $ref: '#/components/parameters/RecordedAt'
        - $ref: '#/components/parameters/MutationExpectedRevision'
      operationId: moveParticipant
      x-wariwari-heavy-ok: Group writes return the refreshed canonical snapshot.
      summary: Reorder a participant
      description: |
        Moves a participant to an absolute `position` or one step in a `direction`.
        Positions are ordering metadata: reordering changes no participant's
        `lockVersion`, so queued edits to the reordered participants still apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PositionMove'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
