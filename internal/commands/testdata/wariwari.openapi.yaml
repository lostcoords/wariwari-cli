        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/groups/{group_token}/membership:
    parameters:
      - $ref: '#/components/parameters/GroupTokenAsParent'
    post:
      tags:
        - invitations
      parameters:
        - $ref: '#/components/parameters/MutationOperationId'
        - $ref: '#/components/parameters/RecordedAt'
      operationId: joinGroup
      x-wariwari-heavy-ok: Group writes return the refreshed canonical snapshot.
      summary: Join a public group
      description: Adds the current user as a registered member of a public-editable group. Existing members receive a snapshot without another membership. An optional operation ID records an account-scoped receipt so a retry does not recreate a subsequently removed membership. Current group access and join permission are checked before replay; viewer access reflects the current request.
      responses:
        '200':
          description: Already a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSnapshot'
        '201':
          description: Joined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSnapshot'
        '401':
