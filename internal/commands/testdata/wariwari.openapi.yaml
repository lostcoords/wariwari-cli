openapi: 3.1.0
info:
  title: wariwari API
  version: '1'
  x-logo:
    url: '%LOGO_URL%'
    altText: wariwari
    href: https://wariwari.jp/
  description: |
    Create and sync wariwari groups, participants, categories,
    transactions, net balances, and settlement suggestions.

    Send `Authorization: Bearer <credential>` with a developer API key or a
    first-party session token. An operation that lists an empty security
    requirement also answers without one: signing in, and reading or editing
    a public group, whose link is the capability.

    Every response includes `X-Request-Id`, and every failure is a `Problem`
    whose `instance` repeats it. A rate-limited response is `429` with
    `RATE_LIMIT_EXCEEDED`, `Retry-After` (seconds) and `RateLimit-Scope`.

    Rate limits:
    - 240 requests a minute per IP address for anonymous requests and
      developer API keys.
    - 60 requests a minute per developer API key.
    - 600 requests a minute per first-party session, in place of the IP limit,
      so an app can flush writes it queued offline.
    - 1,000 changes a UTC day per group, shared by everyone who edits it. Only
      writes that succeed count: replays of an `Idempotency-Key`, conflicts,
      and rejected requests do not.
    - 20 new groups an hour per IP address without a credential, and per
      account for a developer API key.
    - 20 sign-in attempts a minute per IP address, 10 import drafts an hour
      per IP address, 10 access requests and 5 email-change requests an hour
      per account.

    A developer API key on a free account reads only: 50 calls a month, and
    any write returns `403` with `PRO_REQUIRED` and an `upgradeUrl`. An
    exhausted quota returns `429` with `QUOTA_EXCEEDED` and a `Retry-After`
    until the next month. On a Pro account (lifetime, ¥980) keys read and
    write without a monthly quota.

    Names are camelCase and enum values snake_case. An enum can gain a value
    and an object a field: ignore what you don't know.

    Every `PATCH` and `DELETE` of a resource that has a `lockVersion` (a
    group, category, participant, transaction or payment method) sends the
    `lockVersion` it last saw in the `Expected-Revision` header, never in the
    body. A stale one is `409 CONFLICT` with the record as the server now has
    it. Creates and reorders send none. A recurring expense has no
    `lockVersion`: the last write wins. A batch names each transaction's
    revision in its body, since one header can't carry several.

    `GET /v1/groups/{group_token}` is the one read of a whole group. A write
    returns the resource it changed and a delete returns `204`. Every
    successful response under a group carries `Read-Model-Version`, the
    group's `readModelVersion` after the request. A successful write under a
    group moves that version by exactly 1, however many records it changes,
    and by 0 when it changed nothing: a write that found everything as asked,
    or the replay of an `Idempotency-Key`. So a client holding the group at
    version N stays whole when a write answers N + 1 and it applies the
    returned resource, or answers N; after any other value it reads the
    group again.

    Every write under a group takes `Idempotency-Key`, a UUID naming the
    write, and `Recorded-At`, when the change was made on a client that
    queued it offline. The receipt stores the outcome atomically with the
    write, so an identical retry returns that outcome, with
    `Idempotency-Replay: true`, without repeating side effects. Reusing a key
    with a different method, path or body returns 409. Receipts are kept for
    90 days; older retries need reconciling first.
servers:
  - url: https://api.wariwari.jp
    description: Production
  - url: https://api.wariwari.localhost
    description: Local
security:
  - bearerAuth: []
tags:
  - name: groups
    x-displayName: Groups
    description: Groups for splitting shared costs across participants.
  - name: search
    x-displayName: Search
    description: Finding groups, people and transactions across every group the caller belongs to.
  - name: participants
    x-displayName: Participants
    description: People in a group.
  - name: categories
    x-displayName: Categories
    description: Labels for group transactions.
  - name: transactions
    x-displayName: Transactions
    description: Group expenses and settlement payments.
  - name: attachments
    x-displayName: Photos & Files
    description: Photos and files shared in a group. Uploading needs a Pro group; reading and deleting never do.
  - name: recurring_expenses
    x-displayName: Recurring Expenses
    description: Expenses posted on a schedule. Pro groups only.
  - name: invitations
    x-displayName: Invitations & Membership
    description: Invite links for private groups and joining public groups.
  - name: access_requests
    x-displayName: Access Requests
    description: Asking to join a private group, and admins approving or declining.
  - name: account
    x-displayName: Account
    description: Profile, security, and preferences for the signed-in user.
  - name: feedback
    x-displayName: Feedback
    description: Messages to the wariwari team, with or without an account.
paths:
  /v1/cli_authorizations:
    post:
      tags:
        - session
      operationId: startCliAuthorization
      security: []
      summary: Start a browser sign-in for a terminal
      description: |
        Device authorization request (RFC 8628 §3.1). Returns a `deviceCode`
        for the CLI to keep and a short `userCode` for the person to enter at
        `verificationUri`, where they approve or deny the request while signed
        in. Poll `POST /v1/cli_authorizations/token` with the `deviceCode`
        every `interval` seconds until it answers or `expiresIn` runs out.
        No bearer token is required. Limited to 10 requests an hour per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CliAuthorizationCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliAuthorization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/cli_authorizations/token:
    post:
      tags:
        - session
      operationId: claimCliAuthorization
      security: []
      summary: Poll for the CLI API key
      description: |
        Device access token request (RFC 8628 §3.4). Once the person approves,
        the first poll mints a developer API key named "CLI on <clientName>"
        and returns it with the user; it is never shown again. Until then the
        poll answers `400` with `AUTHORIZATION_PENDING`, `SLOW_DOWN` when it
        came sooner than `interval` seconds after the previous one (add 5
        seconds to the interval), or `AUTHORIZATION_DENIED` if they denied it.
        `EXPIRED_TOKEN` covers an expired, already claimed, or unknown device
        code; start a new sign-in. No bearer token is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CliAuthorizationTokenRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliAuthorizationToken'
        '400':
          description: |
            The request isn't approved yet, was denied, or can no longer be
            claimed. The codes follow RFC 8628 §3.5: keep polling on
            `AUTHORIZATION_PENDING`, wait 5 seconds longer on `SLOW_DOWN`, and stop
            on `AUTHORIZATION_DENIED` or `EXPIRED_TOKEN`. `VALIDATION_FAILED` means
            the body was malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/search:
    get:
      tags:
        - search
      operationId: listSearchResults
      x-wariwari-unpaginated-ok: Capped at 6 groups, 6 people and 8 expenses.
      summary: Search groups, people and expenses
      description: |
        The search behind the web navbar, across every group the caller belongs
        to. Matches group names, member names, expense descriptions and
        categories; a query that is just an amount (`7000`, `¥7,000`, `12.50`) or
        an ISO date (`2026-05-22`) also matches expenses with that amount or date.
        A blank query returns the caller's most recently active groups.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/groups:
    get:
      tags:
        - groups
      operationId: listGroups
      x-wariwari-paginated: true
      summary: List groups
      description: |
        Returns groups where the authenticated user is a linked participant.
      parameters:
        - name: archived
          in: query
          required: false
          description: When true, lists the groups the user belongs to and has archived instead of their active set.
          schema:
            type: boolean
        - $ref: '#/components/parameters/PageTake'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      security:
        - {}
        - bearerAuth: []
      tags:
        - groups
      operationId: createGroup
      summary: Create a group
      description: |
        Creates a group anonymously with a client token, or as the signed-in
        account with any credential; the account is linked to the creator
        participant as an admin. Developer API keys and OAuth grants may create
        20 groups an hour per account. The optional client-generated group token makes
        creation replay-safe. Reusing a token under another operation conflicts.
        `Idempotency-Key` also makes an identical
        retry safe for 90 days; reusing it with a different body returns
        `409 IDEMPOTENCY_KEY_IN_USE`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RecordedAt'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreate'
      responses:
        '201':
          description: Created
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
            Read-Model-Version:
              $ref: '#/components/headers/ReadModelVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/groups/{group_token}:
    parameters:
      - $ref: '#/components/parameters/GroupTokenAsParent'
    get:
      security:
        - {}
        - bearerAuth: []
      tags:
        - groups
      operationId: showGroup
      summary: Retrieve a group
      description: |
        Returns a full group snapshot: metadata, categories, participants,
        transactions, net balances, suggested payments, and spending totals.
        Public groups are readable by anyone with the link, without an account.
        Private groups require linked membership. Invalid supplied credentials
        are rejected even for public groups.
      responses:
        '200':
          description: OK
          headers:
            Read-Model-Version:
              $ref: '#/components/headers/ReadModelVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      security:
        - {}
        - bearerAuth: []
      tags:
        - groups
      operationId: updateGroup
      summary: Update a group
      description: |
        Changes the group's name, icon, currency or visibility. Requires the
        latest `lockVersion`. `viewerAccess` says which of these the caller may
        change; one it may not is a 403.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RecordedAt'
        - $ref: '#/components/parameters/ExpectedRevision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupUpdate'
      responses:
        '200':
          description: Updated
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
            Read-Model-Version:
              $ref: '#/components/headers/ReadModelVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      security:
        - {}
        - bearerAuth: []
      tags:
        - groups
      operationId: deleteGroup
      summary: Delete a group
      description: |
        Soft-deletes the group and clears the caller's archival flag for it.
        Requires group edit access and the latest `lockVersion`. Returns 204.
        Anonymous link holders may delete public editable groups. Deleting a group
        that is already deleted returns 204 again without writing anything, whatever
        the operation ID or `lockVersion`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RecordedAt'
        - $ref: '#/components/parameters/ExpectedRevision'
      responses:
        '204':
          description: Deleted
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
            Read-Model-Version:
              $ref: '#/components/headers/ReadModelVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/groups/{group_token}/activity:
    parameters:
      - $ref: '#/components/parameters/GroupTokenAsParent'
    get:
      security:
        - {}
        - bearerAuth: []
      tags:
        - groups
      operationId: listGroupActivity
      x-wariwari-paginated: true
      summary: List group activity
      description: |
        Returns transaction activity for the group, newest first.
      parameters:
        - $ref: '#/components/parameters/PageTake'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          headers:
            Read-Model-Version:
              $ref: '#/components/headers/ReadModelVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionActivityList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/groups/{group_token}/categories:
    parameters:
      - $ref: '#/components/parameters/GroupTokenAsParent'
    post:
      security:
        - {}
        - bearerAuth: []
      tags:
        - categories
      operationId: createGroupCategory
      summary: Create a group category
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RecordedAt'
      description: |
        Creates a category and returns it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCategoryCreate'
      responses:
        '201':
          description: Created
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
            Read-Model-Version:
              $ref: '#/components/headers/ReadModelVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupCategory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/groups/{group_token}/categories/{category_token}:
    parameters:
      - $ref: '#/components/parameters/GroupTokenAsParent'
      - $ref: '#/components/parameters/GroupCategoryToken'
    patch:
      security:
        - {}
        - bearerAuth: []
      tags:
        - categories
      operationId: updateGroupCategory
      summary: Update a group category
      description: |
        Updates an existing category and returns it.
        Requires the latest `lockVersion`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RecordedAt'
        - $ref: '#/components/parameters/ExpectedRevision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCategoryUpdate'
      responses:
        '200':
          description: Updated
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
            Read-Model-Version:
              $ref: '#/components/headers/ReadModelVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupCategory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      security:
        - {}
        - bearerAuth: []
      tags:
        - categories
      operationId: deleteGroupCategory
      summary: Delete a group category
      description: |
        Deletes an unused category. The last category and categories used by
        transactions cannot be deleted. Requires the latest `lockVersion`.
        Categories are removed outright, so
        deleting a token the group no longer has succeeds.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RecordedAt'
        - $ref: '#/components/parameters/ExpectedRevision'
      responses:
        '204':
          description: Deleted
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
            Read-Model-Version:
              $ref: '#/components/headers/ReadModelVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/groups/{group_token}/participants:
    parameters:
      - $ref: '#/components/parameters/GroupTokenAsParent'
    post:
      security:
        - {}
        - bearerAuth: []
      tags:
        - participants
      operationId: createParticipant
      summary: Create a participant
      description: |
        Creates a participant and returns it. Session
        credentials and developer API keys are both supported. Reusing a client
        token returns `409 DUPLICATE_TOKEN`; use `Idempotency-Key` to retry a
        create safely.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RecordedAt'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantCreate'
      responses:
        '201':
          description: Created
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
            Read-Model-Version:
              $ref: '#/components/headers/ReadModelVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/groups/{group_token}/participants/{participant_token}:
    parameters:
      - $ref: '#/components/parameters/GroupTokenAsParent'
      - $ref: '#/components/parameters/ParticipantToken'
    patch:
      security:
        - {}
        - bearerAuth: []
      tags:
        - participants
      operationId: updateParticipant
      summary: Update a participant
      description: |
        Renames or recolours a guest, or changes a linked member's role, and
        returns the participant. Requires the latest `lockVersion`.
        A member linked to an account takes their name and colour from it, so
        sending `name` or `color` for one is a 400; a role for a guest is a 400 too.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RecordedAt'
        - $ref: '#/components/parameters/ExpectedRevision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantUpdate'
      responses:
        '200':
          description: Updated
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
            Read-Model-Version:
              $ref: '#/components/headers/ReadModelVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      security:
        - {}
        - bearerAuth: []
      tags:
        - participants
      operationId: deleteParticipant
      summary: Delete a participant
      description: |
