openapi: 3.1.0
info:
  title: wariwari API
  version: 1.2.0
  x-logo:
    url: '%LOGO_URL%'
    altText: wariwari
    href: https://wariwari.jp/
  description: |
    Create and sync wariwari groups, participants, categories,
    transactions, net balances, and settlement suggestions.

    Send `Authorization: Bearer <api_key>` on every request unless an
    operation says otherwise.

    Every response includes `X-Request-Id`. Rate-limited responses return
    `429` with `RATE_LIMIT_EXCEEDED` and `Retry-After` (seconds); wait that
    long before retrying.

    Rate limits:
    - 240 requests a minute per IP address for anonymous requests and
      developer API keys.
    - 60 requests a minute per developer API key.
    - 600 requests a minute per first-party session, in place of the IP limit,
      so an app can flush writes it queued offline.
    - 1,000 changes a day per group, shared by everyone who edits it. Only
      writes that succeed count: replays of an `Idempotency-Key`, conflicts,
      and rejected requests do not.

    `RateLimit-Limit`, `RateLimit-Remaining`, and `RateLimit-Reset` describe
    the per-minute bucket the request was counted against.

    Full access is currently enabled for every account and group, so developer
    API keys have no monthly usage quota. Short-term per-IP and per-credential
    rate limits still apply. When quotas are on, a metered key's responses
    carry `X-Quota-Limit`, `X-Quota-Remaining`, and `X-Quota-Reset`, and an
    exhausted quota returns `429` with `QUOTA_EXCEEDED`.

    Updates use optimistic locking. Send the latest `lockVersion` from the
    resource you are updating. Stale versions return `409 CONFLICT` with the
    current server state. Create requests do not include `lockVersion`.

    Group writes that declare the `Idempotency-Key` header accept an
    operation UUID. Invitation, notification-settings, import, and
    participant-unlink writes don't take one. The authorized user-scoped
    receipt stores the outcome atomically with the write; an identical retry
    returns that outcome without repeating side effects. Reusing an ID with a
    different method, path, or body returns 409. Receipts are retained for 90
    days; older ambiguous retries require reconciliation. Writes queued
    offline can also send `Recorded-At` with the time the change was made.
servers:
  - url: https://api.wariwari.jp
    description: Production
  - url: https://api.wariwari.localhost
    description: Local
security:
  - bearerAuth: []
tags:
  - name: groups
    x-displayName: Groups
    description: Groups for splitting shared costs across participants.
  - name: participants
    x-displayName: Participants
    description: People in a group.
  - name: categories
    x-displayName: Categories
    description: Labels for group transactions.
  - name: transactions
    x-displayName: Transactions
    description: Group expenses and settlement payments.
  - name: payments
    x-displayName: Payments
    description: Settlements recorded between two participants.
  - name: invitations
    x-displayName: Invitations & Membership
    description: Invite links for private groups and joining public groups.
  - name: access_requests
    x-displayName: Access Requests
    description: Asking to join a private group, and admins approving or declining.
  - name: account
    x-displayName: Account
    description: Profile, security, and preferences for the signed-in user.
  - name: feedback
    x-displayName: Feedback
    description: Messages to the wariwari team, with or without an account.
paths:
  /v1/cli_authorizations:
    post:
      tags:
        - session
      operationId: startCliAuthorization
      security: []
      summary: Start a browser sign-in for a terminal
      description: |
        Device authorization request (RFC 8628 §3.1). Returns a `deviceCode`
        for the CLI to keep and a short `userCode` for the person to enter at
        `verificationUri`, where they approve or deny the request while signed
        in. Poll `POST /v1/cli_authorizations/token` with the `deviceCode`
        every `interval` seconds until it answers or `expiresIn` runs out.
        No bearer token is required. Limited to 10 requests an hour per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CliAuthorizationCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliAuthorization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/cli_authorizations/token:
    post:
      tags:
        - session
      operationId: claimCliAuthorization
      security: []
      summary: Poll for the CLI API key
      description: |
        Device access token request (RFC 8628 §3.4). Once the person approves,
        the first poll mints a developer API key named "CLI on <clientName>"
        and returns it with the user; it is never shown again. Until then the
        poll answers `400` with `AUTHORIZATION_PENDING`, `SLOW_DOWN` when it
        came sooner than `interval` seconds after the previous one (add 5
        seconds to the interval), or `ACCESS_DENIED` if they denied it.
        `EXPIRED_TOKEN` covers an expired, already claimed, or unknown device
        code; start a new sign-in. No bearer token is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CliAuthorizationTokenRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliAuthorizationToken'
        '400':
          description: The request isn't approved yet, was denied, or can no longer be claimed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400CliAuthorization'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/search:
    get:
      tags:
        - groups
      operationId: listSearchResults
      x-wariwari-unpaginated-ok: Capped at 6 groups, 6 people and 8 expenses.
      summary: Search groups, people and expenses
      description: |
        The search behind the web navbar, across every group the caller belongs
        to. Matches group names, member names, expense descriptions and
        categories; a query that is just an amount (`7000`, `¥7,000`, `12.50`) or
        an ISO date (`2026-05-22`) also matches expenses with that amount or date.
        A blank query returns the caller's most recently active groups.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/groups:
    get:
      tags:
        - groups
      operationId: listGroups
      x-wariwari-paginated: true
      summary: List groups
      description: |
        Returns groups where the authenticated user is a linked participant.
      parameters:
        - name: archived
          in: query
          required: false
          description: When true, lists the groups the user has archived instead of their active set.
          schema:
            type: boolean
        - name: take
          in: query
          required: false
          description: Number of groups to return. Defaults to 50; maximum 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: Cursor from the previous response.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      security:
        - {}
        - bearerAuth: []
      tags:
        - groups
      operationId: createGroup
      x-wariwari-heavy-ok: Create returns the initial snapshot so clients receive server-created categories and participant lock versions.
      summary: Create a group
      description: |
        Creates a group anonymously with a client token, or as the signed-in
        account with any credential; the account is linked to the creator
        participant as an admin. Developer API keys and OAuth grants may create
        20 groups an hour per account. The optional client-generated group token makes
        creation replay-safe. Reusing a token under another operation conflicts.
        `Idempotency-Key` also makes an identical
        retry safe for 90 days; reusing it with a different body returns
        `409 IDEMPOTENCY_KEY_IN_USE`.
      parameters:
        - $ref: '#/components/parameters/MutationOperationId'
        - $ref: '#/components/parameters/RecordedAt'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/groups/{group_token}:
    parameters:
      - $ref: '#/components/parameters/GroupTokenAsParent'
    get:
      security:
        - {}
        - bearerAuth: []
      tags:
        - groups
      operationId: showGroup
      x-wariwari-heavy-ok: Group read endpoint; intentionally returns the complete group render state.
      summary: Retrieve a group
      description: |
        Returns a full group snapshot: metadata, categories, participants,
        transactions, net balances, suggested payments, and spending totals.
        Public groups are readable by anyone with the link, without an account.
        Private groups require linked membership. Invalid supplied credentials
        are rejected even for public groups.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      security:
        - {}
        - bearerAuth: []
      tags:
        - groups
      operationId: updateGroup
      x-wariwari-heavy-ok: Group writes return the refreshed canonical snapshot.
      summary: Update a group
      description: |
        Updates group metadata. Requires the latest `lockVersion`. Changing
        `currency` rebases existing transactions onto it in the background,
        which bumps their `lockVersion`.
      parameters:
        - $ref: '#/components/parameters/MutationOperationId'
        - $ref: '#/components/parameters/RecordedAt'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      security:
        - {}
        - bearerAuth: []
      tags:
        - groups
      operationId: deleteGroup
      summary: Delete a group
      description: |
        Soft-deletes the group and clears the caller's archival flag for it.
        Requires group edit access and the latest `lockVersion`. Returns 204.
        Anonymous link holders may delete public editable groups. Deleting a group
        that is already deleted returns 204 again without writing anything, whatever
        the operation ID or `lockVersion`.
      parameters:
        - $ref: '#/components/parameters/MutationOperationId'
        - $ref: '#/components/parameters/RecordedAt'
        - $ref: '#/components/parameters/MutationExpectedRevision'
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/groups/{group_token}/activity:
    parameters:
      - $ref: '#/components/parameters/GroupTokenAsParent'
    get:
      security:
        - {}
        - bearerAuth: []
      tags:
        - groups
      operationId: listGroupActivity
      x-wariwari-paginated: true
      summary: List group activity
      description: |
        Returns transaction activity for the group, newest first.

        History older than one month is omitted unless the group has extended
        activity history (a premium sponsor, or full access while it is enabled).
      parameters:
        - name: take
          in: query
          required: false
          description: Number of activity entries to return. Defaults to 50; maximum 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: Cursor from the previous response.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionActivityList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/groups/{group_token}/categories:
    parameters:
      - $ref: '#/components/parameters/GroupTokenAsParent'
    post:
      security:
        - {}
        - bearerAuth: []
      tags:
        - categories
      operationId: createGroupCategory
      x-wariwari-heavy-ok: Group writes return the refreshed canonical snapshot.
      summary: Create a group category
      parameters:
        - $ref: '#/components/parameters/MutationOperationId'
        - $ref: '#/components/parameters/RecordedAt'
      description: |
        Creates a category and returns the refreshed group snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCategoryCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/groups/{group_token}/categories/{category_token}:
    parameters:
      - $ref: '#/components/parameters/GroupTokenAsParent'
      - $ref: '#/components/parameters/GroupCategoryToken'
    patch:
      security:
        - {}
        - bearerAuth: []
      tags:
        - categories
      operationId: updateGroupCategory
      x-wariwari-heavy-ok: Group writes return the refreshed canonical snapshot.
      summary: Update a group category
      description: |
        Updates an existing category and returns the refreshed group snapshot.
        Requires the latest `lockVersion`.
      parameters:
        - $ref: '#/components/parameters/MutationOperationId'
        - $ref: '#/components/parameters/RecordedAt'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCategoryUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      security:
        - {}
        - bearerAuth: []
      tags:
        - categories
      operationId: deleteGroupCategory
      x-wariwari-heavy-ok: Group writes return the refreshed canonical snapshot.
      summary: Delete a group category
      description: |
        Deletes an unused category. The last category and categories used by
        transactions cannot be deleted. Requires the latest `lockVersion` and
        returns the refreshed group snapshot. Categories are removed outright, so
        deleting a token the group no longer has succeeds with the snapshot.
      parameters:
        - $ref: '#/components/parameters/MutationOperationId'
        - $ref: '#/components/parameters/RecordedAt'
        - $ref: '#/components/parameters/MutationExpectedRevision'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/groups/{group_token}/participants:
    parameters:
      - $ref: '#/components/parameters/GroupTokenAsParent'
    post:
      security:
        - {}
        - bearerAuth: []
      tags:
        - participants
      operationId: createParticipant
      x-wariwari-heavy-ok: Group writes return the refreshed canonical snapshot.
      summary: Create a participant
      description: |
        Creates a participant and returns the refreshed group snapshot. Session
        credentials and developer API keys are both supported. Reusing a client
        token returns `409 DUPLICATE_TOKEN`; use `Idempotency-Key` to retry a
        create safely.
      parameters:
        - $ref: '#/components/parameters/MutationOperationId'
        - $ref: '#/components/parameters/RecordedAt'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/groups/{group_token}/participants/{participant_token}:
    parameters:
      - $ref: '#/components/parameters/GroupTokenAsParent'
      - $ref: '#/components/parameters/ParticipantToken'
    patch:
      security:
        - {}
        - bearerAuth: []
      tags:
        - participants
      operationId: updateParticipant
      x-wariwari-heavy-ok: Group writes return the refreshed canonical snapshot.
      summary: Update a participant
      description: |
        Updates an existing participant and returns the refreshed group snapshot.
        Requires the latest `lockVersion`.
      parameters:
        - $ref: '#/components/parameters/MutationOperationId'
        - $ref: '#/components/parameters/RecordedAt'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      security:
        - {}
        - bearerAuth: []
      tags:
        - participants
      operationId: deleteParticipant
      x-wariwari-heavy-ok: Group writes return the refreshed canonical snapshot.
      summary: Delete a participant
      description: |
        Soft-deletes a participant and returns the refreshed group snapshot.
        Requires the latest `lockVersion`. Deleting a participant that is already
        deleted (or merged away) returns the snapshot without writing anything,
        whatever the operation ID or revision.
      parameters:
        - $ref: '#/components/parameters/MutationOperationId'
        - $ref: '#/components/parameters/RecordedAt'
        - $ref: '#/components/parameters/MutationExpectedRevision'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/groups/{group_token}/transactions:
    parameters:
      - $ref: '#/components/parameters/GroupTokenAsParent'
    get:
      security:
        - {}
        - bearerAuth: []
      tags:
        - transactions
      operationId: listTransactions
      x-wariwari-paginated: true
      summary: List transactions
      description: |
        Returns the group's transactions, newest first (by date, then time of
        day, with unknown times after known times on the same date). Deleted
        transactions are omitted. Filters are optional and combinable; a `category`
        or `participant` token that matches nothing returns an empty page.
      parameters:
        - name: from
          in: query
          required: false
          description: Only transactions dated on or after this date.
          schema:
            type: string
            format: date
            example: '2026-01-01'
        - name: to
          in: query
          required: false
