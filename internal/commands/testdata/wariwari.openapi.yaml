          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/groups/{group_token}/membership:
    parameters:
      - $ref: '#/components/parameters/GroupTokenAsParent'
    post:
      tags:
        - invitations
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RecordedAt'
      operationId: joinGroup
      summary: Join a public group
      description: Adds the current user as a member of a public-editable group and returns their participant. Someone who is already a member gets their participant back with a 200. With an `Idempotency-Key`, a retry does not recreate a membership that was removed since.
      responses:
        '200':
          description: Already a member
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
            Read-Model-Version:
              $ref: '#/components/headers/ReadModelVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participant'
        '201':
          description: Joined
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
            Read-Model-Version:
              $ref: '#/components/headers/ReadModelVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags:
        - invitations
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RecordedAt'
      operationId: leaveGroup
      summary: Leave a group
      description: |
        Unlinks the current user from their participant, which stays in the group
        as a guest with its history, and clears their archive flag for the group.
        The last admin of a private or view-only group gets 400
        `VALIDATION_FAILED` and nothing changes.
      responses:
        '204':
          description: Left
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
            Read-Model-Version:
              $ref: '#/components/headers/ReadModelVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/groups/{group_token}/access_request:
    parameters:
      - $ref: '#/components/parameters/GroupTokenAsParent'
    get:
      tags:
        - access_requests
      operationId: showAccessRequest
      summary: Show your access request
      description: |
        Returns where the signed-in user's request to join this group stands.
        Works for a private group the user cannot open, and reveals nothing
        about the group beyond its existence, so a client can show a "private
        group, ask for access" screen. Groups the user can already open return
        `viewable`.
      responses:
        '200':
          description: OK
          headers:
            Read-Model-Version:
              $ref: '#/components/headers/ReadModelVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequestStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags:
        - access_requests
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RecordedAt'
      operationId: requestGroupAccess
      summary: Ask to join a private group
      description: |
        Asks the group's admins to let the signed-in user in, and notifies them.
        Idempotent: asking while a request is pending, or within 7 days of a
        decline, changes nothing and returns the current status without
        notifying again. Groups the user can already open return `viewable`.
        Limited to 10 requests per user per hour.
      responses:
        '200':
          description: Unchanged
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
            Read-Model-Version:
              $ref: '#/components/headers/ReadModelVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequestStatus'
        '201':
          description: Asked; the admins were notified
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
            Read-Model-Version:
              $ref: '#/components/headers/ReadModelVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequestStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/groups/{group_token}/access_requests:
    parameters:
      - $ref: '#/components/parameters/GroupTokenAsParent'
    get:
      tags:
        - access_requests
      operationId: listAccessRequests
      x-wariwari-unpaginated-ok: Pending requests per group stay small; admins act on all of them at once.
      summary: List pending access requests
      description: Returns the group's pending access requests, oldest first. Admin-only.
      responses:
        '200':
          description: OK
          headers:
            Read-Model-Version:
              $ref: '#/components/headers/ReadModelVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequestList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/groups/{group_token}/access_requests/{access_request_id}/approval:
    parameters:
      - $ref: '#/components/parameters/GroupTokenAsParent'
      - $ref: '#/components/parameters/AccessRequestId'
    post:
      tags:
        - access_requests
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RecordedAt'
      operationId: approveAccessRequest
      summary: Approve an access request
      description: |
        Adds the requester as an editor, notifies them, and returns their
        participant. Admin-only. A
        request that was already approved or declined returns 404.
      responses:
        '200':
          description: Approved
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
            Read-Model-Version:
              $ref: '#/components/headers/ReadModelVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/groups/{group_token}/access_requests/{access_request_id}:
    parameters:
      - $ref: '#/components/parameters/GroupTokenAsParent'
      - $ref: '#/components/parameters/AccessRequestId'
    delete:
      tags:
        - access_requests
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RecordedAt'
      operationId: declineAccessRequest
      summary: Decline an access request
      description: |
        Declines a pending request. Admin-only. The requester is not notified
        and cannot ask again for 7 days. A request that was already approved
        or declined returns 404.
      responses:
        '204':
          description: Declined
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
            Read-Model-Version:
              $ref: '#/components/headers/ReadModelVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/account:
    get:
      tags:
        - account
      operationId: showAccount
      summary: Show the account profile
      description: Returns the authenticated user's full profile.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      tags:
        - account
      operationId: updateAccount
      summary: Update the account profile
      description: |
        Updates profile fields with JSON. Upload an avatar with a
        `multipart/form-data` body holding only the `avatar` file.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountAvatarUpload'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/feedback:
    post:
      security:
        - {}
        - bearerAuth: []
      tags:
        - feedback
      operationId: createFeedback
      summary: Send feedback to the wariwari team
      description: |
        Delivers a message to the team. No bearer token is required. When the
        caller is signed in, the message is linked to their account and
        replies go to the account's email address, ignoring `email`. Limited
        to 5 messages an hour per account or IP address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackCreate'
      responses:
        '202':
          description: Accepted — the team has been notified.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Developer API key, prefix `wari_`, or a first-party session bearer
        for native/web app operations. Mint developer keys at
        `/account/api_keys` while signed in to the web app.
  schemas:
    CliAuthorizationCreate:
      type: object
      additionalProperties: false
      required:
        - clientName
      properties:
        clientName:
          type: string
          minLength: 1
          maxLength: 80
          description: |
            What the person sees when approving, and the API key's name
            ("CLI on <clientName>", shortened to 50 characters). The CLI sends
            the machine's hostname.
          example: work-laptop
    CliAuthorization:
      type: object
      additionalProperties: false
      required:
        - deviceCode
        - userCode
        - verificationUri
        - verificationUriComplete
        - expiresAt
        - interval
      properties:
        deviceCode:
          type: string
          minLength: 1
          description: Secret the CLI polls with. Keep it out of logs and the terminal.
        userCode:
          type: string
          pattern: ^[BCDFGHJKLMNPQRSTVWXZ]{4}-[BCDFGHJKLMNPQRSTVWXZ]{4}$
          description: Code to show the person, who compares it with the one on the web page.
          example: BDFG-HJKL
        verificationUri:
          type: string
          format: uri
          description: Web page where the person enters `userCode`.
          example: https://wariwari.jp/cli
        verificationUriComplete:
          type: string
          format: uri
          description: '`verificationUri` with the code filled in, to open in the browser.'
          example: https://wariwari.jp/cli?code=BDFG-HJKL
        expiresAt:
          type: string
          format: date-time
          description: When `deviceCode` and `userCode` expire.
        interval:
          type: integer
          minimum: 1
          description: Minimum seconds between token polls.
          example: 5
    ProblemCode:
      type: string
      description: |
        Stable machine-readable code. New codes can appear; treat one you don't know
        by its HTTP status.

        | Status | Codes |
        | --- | --- |
        | 400 | `VALIDATION_FAILED`, `INVALID_REQUEST`; from a terminal sign-in poll also `AUTHORIZATION_PENDING`, `SLOW_DOWN`, `AUTHORIZATION_DENIED`, `EXPIRED_TOKEN` |
        | 401 | `AUTH_CREDENTIALS_REQUIRED`, `AUTH_CREDENTIALS_INVALID` |
        | 403 | `ACCESS_DENIED`, `INSUFFICIENT_PERMISSIONS`, `PRO_REQUIRED` |
        | 404 | `NOT_FOUND` |
        | 405 | `METHOD_NOT_ALLOWED` |
        | 409 | `CONFLICT`, `IDEMPOTENCY_KEY_IN_USE`, `IDEMPOTENCY_RECEIPT_EXPIRED`, `DUPLICATE_TOKEN`, `IDENTITY_LINKED_ELSEWHERE`, `ONBOARDING_REQUIRED` |
        | 413 | `PAYLOAD_TOO_LARGE`, `STORAGE_LIMIT` |
        | 415 | `UNSUPPORTED_MEDIA_TYPE` |
        | 429 | `RATE_LIMIT_EXCEEDED`, `QUOTA_EXCEEDED` |
        | 500 | `INTERNAL_SERVER_EXCEPTION` |
        | 503 | `RATE_LIMIT_UNAVAILABLE`, `RATE_UNAVAILABLE`, `STORE_UNAVAILABLE` |

        Any path answers `405` for a verb it doesn't define and `415` for a body
        that isn't the declared media type; operations don't list those two.
      enum:
        - VALIDATION_FAILED
        - INVALID_REQUEST
        - AUTHORIZATION_PENDING
        - SLOW_DOWN
        - AUTHORIZATION_DENIED
        - EXPIRED_TOKEN
        - AUTH_CREDENTIALS_REQUIRED
        - AUTH_CREDENTIALS_INVALID
        - ACCESS_DENIED
        - INSUFFICIENT_PERMISSIONS
        - PRO_REQUIRED
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - CONFLICT
        - IDEMPOTENCY_KEY_IN_USE
        - IDEMPOTENCY_RECEIPT_EXPIRED
        - DUPLICATE_TOKEN
        - IDENTITY_LINKED_ELSEWHERE
        - ONBOARDING_REQUIRED
        - PAYLOAD_TOO_LARGE
        - STORAGE_LIMIT
        - UNSUPPORTED_MEDIA_TYPE
        - RATE_LIMIT_EXCEEDED
        - QUOTA_EXCEEDED
        - INTERNAL_SERVER_EXCEPTION
        - RATE_LIMIT_UNAVAILABLE
        - RATE_UNAVAILABLE
        - STORE_UNAVAILABLE
    Problem:
      type: object
      description: |
        The one error body. Every failure answers with it, whatever refused the
        request. Switch on `code`; `title` and `detail` are for people.
      required:
        - code
        - title
        - detail
        - status
        - instance
      properties:
        code:
          $ref: '#/components/schemas/ProblemCode'
        title:
          type: string
          minLength: 1
          description: Short summary, the same for every occurrence of this `code`.
        detail:
          type: string
          minLength: 1
          description: Explanation of this occurrence.
        status:
          type: integer
          description: The HTTP status of the response.
        instance:
          type: string
          minLength: 1
          description: The request's `X-Request-Id`. Quote it to support.
        errors:
          type: object
          description: |
            Sent with `VALIDATION_FAILED` when the failure is about particular
            fields. Each key names what was wrong and each value says why. A key is
            a request body field by its path in wire names (`name`,
            `splits/0/amountCents`), a header or query parameter by its name
            (`Expected-Revision`, `take`), or `base` when no single field is at fault.
          additionalProperties:
            type: string
            minLength: 1
        upgradeUrl:
          type: string
          format: uri
          description: |
            Sent with `PRO_REQUIRED` and `QUOTA_EXCEEDED`. Where a person buys
            lifetime Pro. The `detail` states the current price; show it as sent.
    CliAuthorizationTokenRequest:
      type: object
      additionalProperties: false
      required:
        - deviceCode
      properties:
        deviceCode:
          type: string
          minLength: 1
          maxLength: 128
          description: The `deviceCode` from `POST /v1/cli_authorizations`.
    Color:
      type: string
      pattern: ^#[0-9A-F]{6}$
      description: |
        An avatar colour as an uppercase hex string. The server accepts only the
        colours of its palette and answers 400 for any other; the palette can grow.
      example: '#D4A574'
    Locale:
      type: string
      enum:
        - en
        - es
        - ja
      description: |
        Two-letter language code for UI strings and email locale. Clients
        should fall back to `en` for a value they don't recognise.
    Currency:
      type: string
      description: ISO-4217 currency code (uppercase 3-letter alphabetic).
      minLength: 3
      maxLength: 3
      pattern: ^[A-Z]{3}$
      example: JPY
    NotificationPreferences:
      type: object
      additionalProperties: false
      required:
        - newExpense
        - paymentReceived
        - invitationAccepted
        - accessRequested
        - accessApproved
      description: |
        Per-event notification toggles for the signed-in user. Every event is
        on unless explicitly turned off.
      properties:
        newExpense:
          type: boolean
        paymentReceived:
          type: boolean
        invitationAccepted:
          type: boolean
        accessRequested:
          type: boolean
        accessApproved:
          type: boolean
    Account:
      type: object
      required:
        - analyticsId
        - emailAddress
        - name
        - avatarUrl
        - avatarColor
        - locale
        - preferredCurrency
        - marketingOptIn
        - notificationPreferences
        - pro
        - onboarded
        - createdAt
      additionalProperties: false
      properties:
        analyticsId:
          type: string
          format: uuid
          description: |
            The account's stable opaque identifier. It associates analytics events
            across wariwari clients, and the iOS app logs in to RevenueCat as
            `user:<analyticsId>`, in the lowercase form given here.
        emailAddress:
          type: string
          format: email
        name:
          type:
            - string
            - 'null'
          maxLength: 120
          description: Display name. `null` until one is set; show the local part of `emailAddress` then.
        avatarUrl:
          type:
            - string
            - 'null'
          format: uri
          description: Absolute link to the avatar. `null` when there is none.
        avatarColor:
          oneOf:
            - $ref: '#/components/schemas/Color'
            - type: 'null'
        locale:
          oneOf:
            - $ref: '#/components/schemas/Locale'
            - type: 'null'
          description: Preferred language. `null` until one is set; the request's `Accept-Language` decides then.
        preferredCurrency:
          allOf:
            - $ref: '#/components/schemas/Currency'
          description: Default currency for new groups this account creates.
        marketingOptIn:
          type: boolean
        notificationPreferences:
          $ref: '#/components/schemas/NotificationPreferences'
        pro:
          type: boolean
          description: |
            True while the account holds Pro: a purchase that is not refunded and
            not expired. Pro is personal: it lets this account upload photos and
            files, scan receipts and set up recurring expenses in any group,
            and write through the API and AI integrations. Everyone in a group sees
            what a Pro member adds.
        onboarded:
          type: boolean
          description: Whether the account accepted the terms. One that hasn't finishes onboarding before using the app.
        createdAt:
          type: string
          format: date-time
    CliAuthorizationToken:
      type: object
      additionalProperties: false
      required:
        - token
        - account
      properties:
        token:
          type: string
          pattern: ^wari_
          description: |
            Developer API key for `Authorization: Bearer <token>`. Shown once;
            revoke it from the account page under API keys.
        account:
          $ref: '#/components/schemas/Account'
    GroupToken:
      type: string
      description: |
        Group resource token. 16 characters of base58.
      minLength: 16
      maxLength: 16
      pattern: ^[A-HJ-NP-Za-km-z1-9]{16}$
      example: 7gKMjL9pPWsKaHQ4
    GroupRef:
      type: object
      additionalProperties: false
      description: Just enough of a group to name it and link to it.
      required:
        - token
        - name
        - icon
        - currency
      properties:
        token:
          $ref: '#/components/schemas/GroupToken'
        name:
          type: string
        icon:
          type: string
        currency:
          $ref: '#/components/schemas/Currency'
    Token:
      type: string
      description: |
        Resource token: 24 base58 characters (the alphabet leaves out the
        look-alikes `0`, `O`, `I` and `l`). A token never changes. The server
        generates one when a create sends none; a client may choose its own for a
        transaction, participant, category or recurring expense, so a write queued
        offline already knows the token it will have.
      minLength: 24
      maxLength: 24
      pattern: ^[A-HJ-NP-Za-km-z1-9]{24}$
      example: 7gKMjL9pPWsKaHQ4AbwS5kVj
    MembershipRole:
      type: string
      enum:
        - read_only
        - editor
        - admin
    PaymentNetwork:
      type: string
      description: Supported payment network the caller can be paid back through.
      enum:
        - paypay
        - rakuten_pay
        - d_barai
        - merpay
        - line_pay
        - bizum
        - revolut
        - wise
        - paypal
        - venmo
        - cash_app
        - zelle
        - bank_transfer
        - suica
        - other
    PaymentMethodSummary:
      type: object
      additionalProperties: false
      required:
        - network
        - networkLabel
        - identifier
        - preferred
        - shareUrl
        - supportsPaymentPrefill
      properties:
        network:
          $ref: '#/components/schemas/PaymentNetwork'
        networkLabel:
          type: string
        identifier:
          type: string
        preferred:
          type: boolean
        shareUrl:
          type:
            - string
            - 'null'
          format: uri
        supportsPaymentPrefill:
          type: boolean
    Participant:
      type: object
      additionalProperties: false
      required:
        - token
        - name
        - linked
        - membershipRole
        - avatarUrl
        - color
        - position
        - paymentMethods
        - lockVersion
        - createdAt
        - updatedAt
      properties:
        token:
          $ref: '#/components/schemas/Token'
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: A guest's name is at most 60 characters; a linked member shows their account's name, which may be up to 120.
        linked:
          type: boolean
          description: |
            Whether the member is a wariwari account. A linked member's name and
            colour come from that account, so only guests can be renamed or recoloured.
        membershipRole:
          $ref: '#/components/schemas/MembershipRole'
          description: Permission role for linked members. Guest participants default to editor.
        avatarUrl:
          type:
            - string
            - 'null'
          format: uri
          description: |
            Absolute link to the linked account's avatar. `null` for a guest or an
            account without one.
        color:
          oneOf:
            - $ref: '#/components/schemas/Color'
            - type: 'null'
          description: Avatar colour, or `null` for the default.
        position:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Stable display order inside the group.
        paymentMethods:
          type: array
          description: |
            The linked member's payment methods, in display order — the same set
            the web group page renders. Empty for guests or members with none.
          items:
            $ref: '#/components/schemas/PaymentMethodSummary'
        lockVersion:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SearchPerson:
      type: object
      additionalProperties: false
      required:
        - group
        - participant
      properties:
        group:
          $ref: '#/components/schemas/GroupRef'
        participant:
          $ref: '#/components/schemas/Participant'
    TransactionKind:
      type: string
      enum:
        - expense
        - payment
      description: |
        `expense` is normal spending; `payment` is money sent from one
        participant to another to settle balances.
    DecimalString:
      type: string
      pattern: ^\d+(\.\d+)?$
      description: A non-negative decimal number as a string, so no precision is lost to floats.
      example: '150.25'
    SplitType:
      type: string
      description: |
        How a transaction's amount is divided across participants.
          • `equal` — equal shares across all listed participants.
          • `percentage` — percentage shares (sum to 100, server normalizes
            rounding cents).
          • `shares` — weighted shares (e.g. 1, 2, 1 → 25/50/25 split).
          • `amount` — exact per-participant amounts supplied by the client.
      enum:
        - equal
        - percentage
        - shares
        - amount
    TimeOfDay:
      type: string
      description: Local wall-clock time, `HH:MM` or `HH:MM:SS` (24-hour).
      pattern: ^(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d)?$
      example: '19:30'
    Split:
      type: object
      additionalProperties: false
      required:
        - participantToken
        - amountCents
        - amountBaseCents
      properties:
        participantToken:
          $ref: '#/components/schemas/Token'
        amountCents:
          type: integer
          minimum: 0
        amountBaseCents:
          type: integer
          minimum: 0
          description: |
            This participant's share in the transaction's balance currency, as the
            server's balances count it.
    Transaction:
      type: object
      additionalProperties: false
      required:
        - token
        - sortId
        - kind
        - lockVersion
        - description
        - categoryName
        - categoryEmoji
        - categoryToken
        - amountCents
        - currency
        - balanceCurrency
        - amountBaseCents
        - baseCurrency
        - exchangeRate
        - exchangeRateProvisional
        - conversionPending
        - splitType
        - date
        - timeOfDay
        - paidByParticipantToken
        - hasReceiptPhoto
        - splits
        - createdAt
        - updatedAt
        - deletedAt
      properties:
        token:
          $ref: '#/components/schemas/Token'
        sortId:
          type: integer
          minimum: 1
          description: Server-side transaction order tie-breaker for stable first paint/cache hydration.
        kind:
          $ref: '#/components/schemas/TransactionKind'
        lockVersion:
          type: integer
          minimum: 0
        description:
          type: string
          minLength: 1
          maxLength: 120
        categoryName:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 40
          description: The group category's name, for display. `null` for a payment and for an expense filed under no category.
        categoryEmoji:
          type: string
          minLength: 1
          maxLength: 32
        categoryToken:
          oneOf:
            - $ref: '#/components/schemas/Token'
            - type: 'null'
        amountCents:
          type: integer
          minimum: 1
          description: Amount in the transaction's native currency (minor units).
        currency:
          $ref: '#/components/schemas/Currency'
        balanceCurrency:
          $ref: '#/components/schemas/Currency'
          description: |
            Currency bucket used for balances and suggested payments. Usually the
            group base currency; when it matches `currency`, the transaction is
            tracked in its original currency instead.
        amountBaseCents:
          type: integer
          minimum: 0
          description: |
            Amount converted to the group's base currency at the rate
            snapshotted when the transaction was saved. Recompute-safe: a later
            FX-rate change does NOT retroactively shift this value.
        baseCurrency:
          $ref: '#/components/schemas/Currency'
        exchangeRate:
          allOf:
            - $ref: '#/components/schemas/DecimalString'
          description: |
            Decimal rate used to convert native → base, as a string to
            avoid float drift. `"1.0"` when the transaction and group share a
            currency.
          example: '150.25'
        exchangeRateProvisional:
          type: boolean
          description: |
            `true` while `exchangeRate` is the latest published rate standing in for
            one not yet published for `date` (today, a future date, or a day the
            provider hasn't caught up on). Once that date's rate is out the server
            converts again, which may change `amountBaseCents` and `exchangeRate`
            without changing `lockVersion`.
        conversionPending:
          type: boolean
          description: |
            `true` while a foreign-currency transaction waits for an exchange rate
            the provider could not supply when it was saved. Until then it balances
            in its own currency (`balanceCurrency` equals `currency`); the server
            retries in the background and moves it to the group currency when rates
            return, without changing `lockVersion`. `false` for a transaction kept in
            its own currency on purpose.
        splitType:
          $ref: '#/components/schemas/SplitType'
        date:
          type: string
          format: date
        timeOfDay:
          oneOf:
            - $ref: '#/components/schemas/TimeOfDay'
            - type: 'null'
          description: |
            Local civil time of the transaction, optionally including seconds.
            `null` when the time is genuinely unknown — an import whose source file
            carried no time column. Reading it as midnight would be wrong: that is a
            real time some transactions actually have.
        paidByParticipantToken:
          oneOf:
            - $ref: '#/components/schemas/Token'
            - type: 'null'
          description: |
            Token of the participant who paid. `null` when the payer was
            removed and the transaction hasn't been reassigned yet.
        hasReceiptPhoto:
          type: boolean
          description: Whether a receipt photo is stored. Read it with `GET …/receipt_photo`; only expenses have one.
        splits:
          type: array
          items:
            $ref: '#/components/schemas/Split'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            `null` everywhere but one place: a `409 CONFLICT` whose `current` is a
            transaction deleted since the caller read it. Lists, snapshots and
            reads leave deleted transactions out.
    SearchTransaction:
      type: object
      additionalProperties: false
      required:
        - group
        - transaction
      properties:
        group:
          $ref: '#/components/schemas/GroupRef'
        transaction:
          $ref: '#/components/schemas/Transaction'
    SearchResults:
      type: object
      additionalProperties: false
      required:
        - groups
        - people
        - transactions
      properties:
        groups:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/GroupRef'
        people:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/SearchPerson'
        transactions:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/SearchTransaction'
    Visibility:
      type: string
      enum:
        - public_editable
        - public_view_only
        - private_registered
      description: |
        Who can open and edit the group by link. `public_editable` lets anyone
        with the link edit, `public_view_only` lets them view, and
        `private_registered` limits access to linked members.
    Group:
      type: object
      required:
        - token
        - name
        - icon
        - currency
        - visibility
        - fxRates
        - shareUrl
        - lockVersion
        - createdAt
        - updatedAt
      properties:
        token:
          $ref: '#/components/schemas/GroupToken'
        name:
          type: string
          minLength: 1
          maxLength: 80
        icon:
          type: string
          minLength: 1
          maxLength: 32
          description: A single emoji used as the group avatar.
          example: 🍜
        currency:
          allOf:
            - $ref: '#/components/schemas/Currency'
          description: Base currency for totals and balances (ISO-4217).
        visibility:
          $ref: '#/components/schemas/Visibility'
        fxRates:
          type: object
          description: |
            Snapshot of cached FX rates relative to the group's base currency,
            keyed by ISO-4217 code (e.g. `USD`, `EUR`). Values are decimal
            strings (`"150.25"`) to avoid float drift. Only currencies warm
            in the server's rate cache are included; missing codes mean the
            client should treat the rate as unknown until the next snapshot.
            The base currency itself is never present.
          additionalProperties:
            $ref: '#/components/schemas/DecimalString'
          example:
            USD: '150.25'
            EUR: '163.10'
        lockVersion:
          type: integer
          minimum: 0
          description: |
            Optimistic lock counter — bump on every persisted update.
            Send the last-seen value on writes; mismatches return 409
            `CONFLICT` with the current server state on `current`.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        shareUrl:
          type: string
          description: |
            Absolute invite link for the group, the same one the web app's
            share sheet shows. Opening it needs no account for public groups.
            The path keeps the group name readable, so it may contain unescaped
            Unicode (an IRI, e.g. `https://wariwari.jp/g/沖縄旅行-…`);
            percent-encode it before handing it to a strict URL parser.
          example: https://wariwari.jp/g/okinawa-trip-mK5Ph2xeykLMKpRM?utm_content=link&utm_medium=share&utm_source=group_invite
    Pagination:
      type: object
      description: Opaque cursor pagination metadata.
      required:
        - hasMore
        - cursor
      properties:
        hasMore:
          type: boolean
          description: Whether more results are available.
          example: true
        cursor:
          type:
            - string
            - 'null'
          minLength: 1
          description: Opaque token to pass as `cursor` on the next request. `null` means there is no next page.
          example: eyJraW5kIjoia2V5c2V0IiwiY3Vyc29yIjoxMjN9
      additionalProperties: false
    GroupList:
      type: object
      required:
        - groups
        - pagination
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/Group'
        pagination:
          $ref: '#/components/schemas/Pagination'
      additionalProperties: false
    GroupCreateParticipant:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        token:
          allOf:
            - $ref: '#/components/schemas/Token'
          description: |
            Optional client-generated token. When absent the server
            generates one (`SecureRandom.base58(24)`).
        name:
          type: string
          minLength: 1
          maxLength: 60
        color:
          oneOf:
            - $ref: '#/components/schemas/Color'
            - type: 'null'
          description: Avatar colour, or `null` for the default.
    GroupCreateCategory:
      type: object
      additionalProperties: false
      required:
        - token
        - emoji
        - name
        - position
      properties:
        token:
          $ref: '#/components/schemas/Token'
        emoji:
          type: string
          minLength: 1
          maxLength: 32
        name:
          type: string
          minLength: 1
          maxLength: 40
        position:
          type: integer
          minimum: 1
    GroupCreate:
      type: object
      additionalProperties: false
      required:
        - name
        - icon
        - participants
      properties:
        token:
          allOf:
            - $ref: '#/components/schemas/GroupToken'
          description: |
            Optional client-generated group token (16-char base58). When absent
            the server generates one. A supplied token is a stable identity; reuse
            under a different operation returns `DUPLICATE_TOKEN` rather than updating.
        name:
          type: string
          minLength: 1
          maxLength: 80
        icon:
          type: string
          minLength: 1
          maxLength: 32
        currency:
          allOf:
            - $ref: '#/components/schemas/Currency'
          default: JPY
          description: Base currency. When omitted, the account's preferred currency, else the request country's, else USD for English and JPY otherwise.
        participants:
          type: array
          maxItems: 1000
          minItems: 1
          items:
            $ref: '#/components/schemas/GroupCreateParticipant'
        creatorParticipantToken:
          allOf:
            - $ref: '#/components/schemas/Token'
          description: |
            Token of the participant in `participants` who is creating the group.
            With an account credential that participant is linked to the account as
            admin and moved first. When omitted, the participant named like the
            account is, or else a new one is added. Must match one of the supplied
            participant tokens.
        categories:
          type: array
          maxItems: 1000
          description: |
            Optional complete initial category set for an offline-created duplicate.
            When supplied, the server preserves these client tokens and does not add
            its default categories. When omitted, the regular defaults are created.
          items:
            $ref: '#/components/schemas/GroupCreateCategory'
    GroupCategory:
      type: object
      additionalProperties: false
      required:
        - token
        - emoji
        - name
        - position
        - used
        - lockVersion
        - createdAt
        - updatedAt
      properties:
        token:
          $ref: '#/components/schemas/Token'
        emoji:
          type: string
          minLength: 1
          maxLength: 32
        name:
          type: string
          minLength: 1
          maxLength: 40
        position:
          type: integer
          minimum: 1
        used:
          type: boolean
          description: Whether any transaction has this category. A used category can't be deleted.
        lockVersion:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PaymentMethod:
      type: object
      additionalProperties: false
      required:
        - token
        - network
        - networkLabel
        - identifier
        - preferred
        - position
        - supportsPaymentPrefill
        - lockVersion
      description: One of the caller's account payment methods.
      properties:
        token:
          $ref: '#/components/schemas/Token'
        network:
          $ref: '#/components/schemas/PaymentNetwork'
        networkLabel:
          type: string
          description: Localized display name for the network (follows the request locale).
        identifier:
          type: string
          minLength: 1
          maxLength: 120
        preferred:
          type: boolean
          description: Whether this is the caller's preferred method, shown first on member rows.
        position:
          type: integer
          minimum: 1
          description: Stable display order within the caller's methods.
        shareUrl:
          type:
            - string
            - 'null'
          format: uri
          description: Deep link to pay the caller, when the network supports one (e.g. Revolut, Wise).
        supportsPaymentPrefill:
          type: boolean
          description: Whether the network can pre-fill a payment amount.
        lockVersion:
          type: integer
          minimum: 0
    ConflictCurrent:
      type: object
      description: |
        Sent with `CONFLICT`: the record as the server now has it, under the key
        that names its kind. Exactly one key is present. A stale record with no
        shape of its own sends no `current`.
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      properties:
        group:
          $ref: '#/components/schemas/Group'
        category:
          $ref: '#/components/schemas/GroupCategory'
        transaction:
          $ref: '#/components/schemas/Transaction'
        participant:
          $ref: '#/components/schemas/Participant'
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
    ConflictProblem:
      description: A Problem answering `409`. `CONFLICT` adds the record that went stale, `ONBOARDING_REQUIRED` the address being signed up.
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            current:
              $ref: '#/components/schemas/ConflictCurrent'
            emailAddress:
              type: string
              format: email
              description: Sent with `ONBOARDING_REQUIRED` when the credential carries a verified address.
    ViewerAccess:
      type: object
      additionalProperties: false
      required:
        - canEdit
        - canManageSettings
        - canManageAccess
        - linkedParticipantToken
      properties:
        canEdit:
          type: boolean
          description: May add and change members, transactions and the group's name and icon.
        canManageSettings:
          type: boolean
          description: May change the group's currency and its categories.
        canManageAccess:
          type: boolean
          description: May change the group's `visibility` and its members' roles.
        linkedParticipantToken:
          oneOf:
            - $ref: '#/components/schemas/Token'
            - type: 'null'
    SuggestedPayment:
      type: object
      additionalProperties: false
      required:
        - fromParticipantToken
        - toParticipantToken
        - amountCents
        - currency
      properties:
        fromParticipantToken:
          allOf:
            - $ref: '#/components/schemas/Token'
          description: Participant token for the member who should pay.
          example: 7gKMjL9pPWsKaHQ4AbwS5kVj
        toParticipantToken:
          allOf:
            - $ref: '#/components/schemas/Token'
          description: Participant token for the member who should receive the payment.
          example: 8mPNkR4qQXtLbJR5CcxT6yWa
        amountCents:
          type: integer
          minimum: 1
        currency:
          $ref: '#/components/schemas/Currency'
    currencyCentBuckets:
      type: object
      additionalProperties:
        type: integer
        minimum: 0
    GroupSnapshot:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/Group'
        - type: object
          required:
            - viewerAccess
            - generatedAt
            - readModelVersion
            - categories
            - participants
            - transactions
            - netByCurrency
            - suggestedPayments
            - spendingByCurrency
            - spendingForcedBuckets
            - totalBaseCents
            - transactionCount
          properties:
            viewerAccess:
              $ref: '#/components/schemas/ViewerAccess'
            generatedAt:
              type: string
              format: date-time
              description: |
                Server clock at the moment this snapshot was assembled. The
                client can use this value as the cache timestamp so "Cached Xm
                ago" stays honest across clock skew.
            readModelVersion:
              type: integer
              minimum: 0
              description: Monotonic group snapshot version for client cache invalidation.
            participants:
              type: array
              items:
                $ref: '#/components/schemas/Participant'
            categories:
              type: array
              items:
                $ref: '#/components/schemas/GroupCategory'
            transactions:
              type: array
              items:
                $ref: '#/components/schemas/Transaction'
            suggestedPayments:
              type: array
              items:
                $ref: '#/components/schemas/SuggestedPayment'
            netByCurrency:
              type: object
              description: |
                Balance net buckets keyed by currency. Inner objects are keyed by
                participant token and contain signed cent values.
              additionalProperties:
                type: object
                additionalProperties:
                  type: integer
            spendingByCurrency:
              $ref: '#/components/schemas/currencyCentBuckets'
            spendingForcedBuckets:
              type: boolean
            totalBaseCents:
              type: integer
              minimum: 0
            transactionCount:
              type: integer
              minimum: 0
      $defs:
        currencyCentBuckets:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
    GroupUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        icon:
          type: string
          minLength: 1
          maxLength: 32
        currency:
          allOf:
            - $ref: '#/components/schemas/Currency'
          description: |
            New base currency. Existing transactions are rebased onto it in the
            background, which bumps their `lockVersion`: re-read a transaction
            before updating or deleting it after a currency change. Needs
            `viewerAccess.canManageSettings`.
        visibility:
          allOf:
            - $ref: '#/components/schemas/Visibility'
          description: |
            Who can open the group by link. Needs `viewerAccess.canManageAccess`.
            A restricted group needs a linked admin; the caller becomes one when
            the group has none.
    TransactionVersionKind:
      type: string
      enum:
        - create
        - update
        - destroy
        - restore
      description: |
        Kind of audit-log entry.
          • `create` — initial revision (no `changes`).
          • `update` — field-level edit; `changes` lists per-field diffs.
          • `destroy` — soft-delete (no `changes`).
          • `restore` — undo of a soft-delete (no `changes`).
    TransactionVersionSubject:
      type: object
      additionalProperties: false
      required:
        - token
        - description
        - deletedAt
      properties:
        token:
          $ref: '#/components/schemas/Token'
        description:
          type: string
          minLength: 1
          maxLength: 120
        deletedAt:
          type:
            - string
            - 'null'
          format: date-time
    ActivityActor:
      type: object
      required:
        - name
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          description: User's display name at the time of the edit.
    TransactionVersionField:
      type: string
      enum:
        - amount
        - description
        - category
        - paid_by
        - split_type
        - date
        - time_of_day
        - splits
      description: |
        Semantic key for a single change entry. The values are
        render-ready strings (currency-formatted amounts, resolved
        participant names, localized dates and labels) — clients
        shouldn't reformat them, just print.
    TransactionVersionChange:
      type: object
      additionalProperties: false
      required:
        - field
      properties:
        field:
          $ref: '#/components/schemas/TransactionVersionField'
        before:
          type:
            - string
            - 'null'
          description: |
            Pre-edit value, render-ready. `null` for the first
            appearance of a field (e.g. on create, though create
            rows skip `changes` entirely).
        after:
          type:
            - string
            - 'null'
          description: Post-edit value, render-ready.
        currencyChanged:
          type: boolean
          description: |
            Set on every `amount` entry: `true` when the currency
            itself changed, `false` otherwise. Absent on other fields.
        summaryCount:
          type: integer
          minimum: 0
          description: |
            Only set on the `splits` entry — number of participants
            whose share was added, removed, or changed.
    TransactionVersion:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - transaction
        - recurring
        - createdAt
        - recordedAt
        - changes
      description: |
        One entry in the audit log for a transaction. `changes` is a
        render-ready list of human-facing field changes for `update`
        rows; create / destroy / restore rows return an empty array (the
        `kind` label carries the meaning). Imported or historical edits can
        leave `actor` null.

        Field formatting (server-side, locale-aware):
          • amount: currency-formatted strings; when the currency itself
            changes, both sides are suffixed with the currency code and
            `currencyChanged: true`.
          • paid_by: resolved participant name (or a localized "Removed
            member" when the participant has been hard-deleted).
          • date: localized via `I18n.l(:short)`.
          • split_type: localized label.
          • splits: a summary entry with `summaryCount` only — no
            `before`/`after` (the per-share diff would be too noisy).
      properties:
        id:
          type: integer
          minimum: 1
        kind:
          $ref: '#/components/schemas/TransactionVersionKind'
        transaction:
          $ref: '#/components/schemas/TransactionVersionSubject'
        actor:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ActivityActor'
          description: |
            Who made the edit. `null` when no actor is available.
        recurring:
          type: boolean
          description: |
            True on the `create` entry of an expense a recurring expense posted.
            `actor` is null there; show it as "Recurring". Stays true after the
            schedule is stopped.
        createdAt:
          type: string
          format: date-time
          description: When the server stored the change.
        recordedAt:
          type: string
          format: date-time
          description: |
            When the change was made: the write's `Recorded-At` header when it sent a
            plausible one, otherwise the same as `createdAt`. Activity is ordered by
            this, newest first.
        changes:
          type: array
          description: |
            Per-field changes; empty for create/destroy/restore. `before` and
            `after` are sentences in the request's language, for showing to a
            person: never parse them.
          items:
            $ref: '#/components/schemas/TransactionVersionChange'
    TransactionActivityList:
      type: object
      required:
        - activity
        - pagination
      properties:
        activity:
          type: array
          items:
            $ref: '#/components/schemas/TransactionVersion'
        pagination:
          $ref: '#/components/schemas/Pagination'
      additionalProperties: false
    GroupCategoryCreate:
      type: object
      additionalProperties: false
      required:
        - emoji
        - name
      properties:
        token:
          allOf:
            - $ref: '#/components/schemas/Token'
          description: Optional client-generated category token for offline creation.
        emoji:
          type: string
          minLength: 1
          maxLength: 8
        name:
          type: string
          minLength: 1
          maxLength: 40
        position:
          type: integer
          minimum: 1
    GroupCategoryUpdate:
      type: object
      additionalProperties: false
      properties:
        emoji:
          type: string
          minLength: 1
          maxLength: 8
        name:
          type: string
          minLength: 1
          maxLength: 40
        position:
          type: integer
          minimum: 1
    ParticipantCreate:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        token:
          allOf:
            - $ref: '#/components/schemas/Token'
          description: |
            Optional client-generated participant token. When absent the server
            generates one. A supplied token is a stable identity; reuse under a
            different operation returns `DUPLICATE_TOKEN` rather than updating.
        name:
          type: string
          minLength: 1
          maxLength: 60
        color:
          oneOf:
            - $ref: '#/components/schemas/Color'
            - type: 'null'
          description: Avatar colour, or `null` for the default.
    ParticipantUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        color:
          oneOf:
            - $ref: '#/components/schemas/Color'
            - type: 'null'
          description: Avatar colour, or `null` for the default.
        membershipRole:
          allOf:
            - $ref: '#/components/schemas/MembershipRole'
          description: |
            Only for a participant linked to an account; a role for a guest is a
            400. Needs `viewerAccess.canManageAccess`. A restricted group keeps at
            least one admin.
    GroupAttachment:
      type: object
      additionalProperties: false
      required:
        - id
        - filename
        - contentType
        - byteSize
        - url
        - thumbnailUrl
        - uploadedByParticipantToken
        - createdAt
      description: A photo or file shared in a group.
      properties:
        id:
          type: integer
          minimum: 1
        filename:
          type: string
        contentType:
          type: string
        byteSize:
          type: integer
          minimum: 0
        width:
          type: integer
          minimum: 1
          description: Pixels, for a photo whose size is known.
        height:
          type: integer
          minimum: 1
          description: Pixels, for a photo whose size is known.
        url:
          type: string
          format: uri
          description: Short-lived link to the stored file.
        thumbnailUrl:
          type:
            - string
            - 'null'
          format: uri
          description: Short-lived link to a square WebP thumbnail; `null` for files that aren't images.
        uploadedByParticipantToken:
          oneOf:
            - $ref: '#/components/schemas/Token'
            - type: 'null'
          description: Token of the member who uploaded it, when known.
        createdAt:
          type: string
          format: date-time
    StorageUsage:
      type: object
      additionalProperties: false
      required:
        - usedBytes
        - limitBytes
      description: Storage the photos, files and receipt photos a person uploaded take, across every group, against their limit.
      properties:
        usedBytes:
          type: integer
          minimum: 0
        limitBytes:
          type: integer
          minimum: 1
    GroupAttachmentList:
      type: object
      required:
        - attachments
        - storage
        - pagination
      properties:
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/GroupAttachment'
        storage:
          description: The signed-in person's storage across every group, or `null` for a reader without an account.
          oneOf:
            - $ref: '#/components/schemas/StorageUsage'
            - type: 'null'
        pagination:
          $ref: '#/components/schemas/Pagination'
      additionalProperties: false
    GroupAttachmentUpload:
      type: object
      additionalProperties: false
      required:
        - file
      properties:
        file:
          type: string
          format: binary
          description: |
            A photo (JPEG, PNG, WebP, HEIC, GIF), PDF, text or CSV file, up to 10 MB.
            Photos other than GIFs are re-encoded to WebP.
    TransactionList:
      type: object
      required:
        - transactions
        - pagination
      properties:
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        pagination:
          $ref: '#/components/schemas/Pagination'
      additionalProperties: false
    SplitInput:
      type: object
      additionalProperties: false
      required:
        - participantToken
      description: |
        `amountCents` is each participant's share. With `splitType: equal`
        it may be omitted from every split, and the server divides the
        amount evenly (leftover cents go to the first participants). A split
        of zero leaves that participant out; no zero split is stored.
      properties:
        participantToken:
          $ref: '#/components/schemas/Token'
        amountCents:
          type: integer
          minimum: 0
    ExpenseCreate:
      type: object
      additionalProperties: false
      description: |
        An expense to create. `splits` must contain the participants who owe money
        for it.
      required:
        - kind
        - description
        - amountCents
        - currency
        - splitType
        - date
        - paidByParticipantToken
        - splits
      properties:
        token:
          allOf:
            - $ref: '#/components/schemas/Token'
          description: |
            Optional client-generated transaction token. When absent the server
            generates one. A supplied token is a stable identity; reuse under a
            different operation returns `DUPLICATE_TOKEN` rather than updating.
        kind:
          type: string
          enum:
            - expense
        description:
          type: string
          minLength: 1
          maxLength: 120
        categoryToken:
          $ref: '#/components/schemas/Token'
        amountCents:
          type: integer
          minimum: 1
        currency:
          $ref: '#/components/schemas/Currency'
        balanceCurrency:
          $ref: '#/components/schemas/Currency'
          description: |
            Currency bucket used for balances. Omit to use the group currency;
            send the transaction currency to keep this transaction in a separate
            original-currency balance bucket.
        splitType:
          $ref: '#/components/schemas/SplitType'
        date:
          type: string
          format: date
        timeOfDay:
          $ref: '#/components/schemas/TimeOfDay'
        paidByParticipantToken:
          $ref: '#/components/schemas/Token'
        splits:
          type: array
          maxItems: 1000
          minItems: 1
          items:
            $ref: '#/components/schemas/SplitInput'
    PaymentCreate:
      type: object
      additionalProperties: false
      description: |
        A settlement payment to record: money one participant sent another.
      required:
        - kind
        - fromParticipantToken
        - toParticipantToken
        - amountCents
      properties:
        kind:
          type: string
          enum:
            - payment
        token:
          allOf:
            - $ref: '#/components/schemas/Token'
          description: |
            Optional client-generated transaction token. When absent the server
            generates one. Reuse under a different operation returns
            `DUPLICATE_TOKEN` rather than updating.
        fromParticipantToken:
          allOf:
            - $ref: '#/components/schemas/Token'
          description: The participant who paid.
        toParticipantToken:
          allOf:
            - $ref: '#/components/schemas/Token'
          description: The participant who received the payment.
        amountCents:
          type: integer
          minimum: 1
          description: Payment amount in minor units.
        currency:
          allOf:
            - $ref: '#/components/schemas/Currency'
          description: Defaults to the group currency.
        description:
          type: string
          maxLength: 120
          description: Blank or omitted uses the default "From → To" label.
        date:
          type: string
          format: date
          description: Defaults to today, or to the day in `Recorded-At`.
        timeOfDay:
          $ref: '#/components/schemas/TimeOfDay'
    TransactionCreate:
      description: |
        An expense or a settlement payment to create. Which one is named by `kind`, which
        can't change once the transaction exists.
      oneOf:
        - $ref: '#/components/schemas/ExpenseCreate'
        - $ref: '#/components/schemas/PaymentCreate'
      discriminator:
        propertyName: kind
        mapping:
          expense: '#/components/schemas/ExpenseCreate'
          payment: '#/components/schemas/PaymentCreate'
    ExpenseUpdate:
      type: object
      additionalProperties: false
      description: |
        Changes to an expense. Omitted fields keep their value. Sending `splits`
        replaces all existing splits.
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - expense
        description:
          type: string
          minLength: 1
          maxLength: 120
        categoryToken:
          description: Omit to keep the category; `null` clears it.
          oneOf:
            - $ref: '#/components/schemas/Token'
            - type: 'null'
        amountCents:
          type: integer
          minimum: 1
        currency:
          $ref: '#/components/schemas/Currency'
        balanceCurrency:
          $ref: '#/components/schemas/Currency'
          description: |
            Currency bucket used for balances. Omit to keep the current value, unless
            the edit changes the amount or currency: then it moves to the group currency.
            Only the group currency or the transaction's own `currency` is kept; any
            other value (such as the group's previous currency) means the group currency.
            Changing the group currency re-expresses balances without changing any
            transaction's `lockVersion`.
        splitType:
          $ref: '#/components/schemas/SplitType'
        date:
          type: string
          format: date
        timeOfDay:
          $ref: '#/components/schemas/TimeOfDay'
        paidByParticipantToken:
          $ref: '#/components/schemas/Token'
        splits:
          type: array
          maxItems: 1000
          minItems: 1
          items:
            $ref: '#/components/schemas/SplitInput'
    PaymentUpdate:
      type: object
      additionalProperties: false
      description: |
        Changes to a settlement payment. Omitted fields keep their value.
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - payment
        fromParticipantToken:
          allOf:
            - $ref: '#/components/schemas/Token'
          description: The participant who paid.
        toParticipantToken:
          allOf:
            - $ref: '#/components/schemas/Token'
          description: The participant who received the payment.
        amountCents:
          type: integer
          minimum: 1
          description: Payment amount in minor units.
        currency:
          allOf:
            - $ref: '#/components/schemas/Currency'
          description: Omit to keep the payment's currency.
        description:
          type: string
          maxLength: 120
          description: |
            Omit to keep the current description. Blank resets it to the default
            "From → To" label for the payment's participants.
        date:
          type: string
          format: date
          description: Omit to keep the payment's date.
        timeOfDay:
          $ref: '#/components/schemas/TimeOfDay'
    TransactionUpdate:
      description: |
        Changes to an expense or to a settlement payment. Which one is named by `kind`, which
        can't change once the transaction exists.
      oneOf:
        - $ref: '#/components/schemas/ExpenseUpdate'
        - $ref: '#/components/schemas/PaymentUpdate'
      discriminator:
        propertyName: kind
        mapping:
          expense: '#/components/schemas/ExpenseUpdate'
          payment: '#/components/schemas/PaymentUpdate'
    ReceiptPhoto:
      type: object
      additionalProperties: false
      required:
        - url
        - contentType
        - byteSize
        - createdAt
      description: The one receipt photo stored for an expense.
      properties:
        url:
          type: string
          format: uri
          description: Short-lived link to the stored image.
        contentType:
          type: string
        byteSize:
          type: integer
          minimum: 1
        width:
          type: integer
          minimum: 1
          description: Pixels. Absent until known for a photo stored before re-encoding.
        height:
          type: integer
          minimum: 1
          description: Pixels. Absent until known for a photo stored before re-encoding.
        createdAt:
          type: string
          format: date-time
    ReceiptPhotoUpload:
      type: object
      additionalProperties: false
      required:
        - photo
      properties:
        photo:
          type: string
          format: binary
          description: A JPEG, PNG, WebP or HEIC image of the receipt.
    TransactionBatchItem:
      type: object
      additionalProperties: false
      required:
        - token
        - expectedRevision
      description: One transaction in a batch, with the revision the caller last saw.
      properties:
        token:
          $ref: '#/components/schemas/Token'
        expectedRevision:
          type: integer
          minimum: 0
          description: The transaction's `lockVersion` when the caller read it.
    BatchSplitMember:
      type: object
      additionalProperties: false
      required:
        - participantToken
      properties:
        participantToken:
          $ref: '#/components/schemas/Token'
        weight:
          type: number
          minimum: 0
    BatchSplit:
      type: object
      additionalProperties: false
      description: |
        The people every expense is split between. Weights are percentages or share counts for
        those split types; an equal split ignores them. Each new name joins the group as a member,
        or reuses the member who already has it.
      properties:
        type:
          type: string
          enum:
            - equal
            - percentage
            - shares
          default: equal
        members:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/BatchSplitMember'
        newMemberNames:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 60
    TransactionBatchUpdate:
      type: object
      additionalProperties: false
      required:
        - transactions
      description: |
        The transactions to change and the changes to make. At least one change is required.
      properties:
        transactions:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/TransactionBatchItem'
        paidByParticipantToken:
          $ref: '#/components/schemas/Token'
        categoryToken:
          $ref: '#/components/schemas/Token'
        date:
          type: string
          format: date
        timeOfDay:
          $ref: '#/components/schemas/TimeOfDay'
        split:
          $ref: '#/components/schemas/BatchSplit'
    TransactionBatchResult:
      type: object
      additionalProperties: false
      required:
        - transactions
        - participants
      properties:
        transactions:
          type: array
          description: Every transaction in the batch, as changed.
          items:
            $ref: '#/components/schemas/Transaction'
        participants:
          type: array
          description: Members the batch added to the group from `split.newMemberNames`.
          items:
            $ref: '#/components/schemas/Participant'
    TransactionDeletionCreate:
      type: object
      additionalProperties: false
      required:
        - transactions
      properties:
        transactions:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/TransactionBatchItem'
    GroupNotificationSettings:
      type: object
      additionalProperties: false
      required:
        - muted
      description: The signed-in member's push-notification settings for one group.
      properties:
        muted:
          type: boolean
          description: When true, this member receives no push notifications for the group.
    GroupDuplicationCreate:
      type: object
      additionalProperties: false
      properties:
        includeMembers:
          type: boolean
          default: true
          description: Copy participants too.
    FxRate:
      type: object
      required:
        - from
        - to
        - rate
        - provisional
      additionalProperties: false
      properties:
        from:
          allOf:
            - $ref: '#/components/schemas/Currency'
          description: Source currency.
        to:
          allOf:
            - $ref: '#/components/schemas/Currency'
          description: Group currency (target).
        rate:
          allOf:
            - $ref: '#/components/schemas/DecimalString'
          description: Conversion rate.
          example: '0.0067'
        provisional:
          type: boolean
          description: |
            `true` when no rate is published for the requested day yet and `rate` is
            the latest one, so an expense saved for that day may be converted again.
    StatsDateRange:
      type: string
      enum:
        - all_time
        - last_12_weeks
        - last_6_months
        - this_month
        - last_month
        - last_3_months
        - this_year
      description: Statistics window.
    StatsFilters:
      type: object
      additionalProperties: false
      required:
        - dateRange
        - participantToken
        - categoryToken
        - date
        - month
        - week
      properties:
        dateRange:
          $ref: '#/components/schemas/StatsDateRange'
        participantToken:
          oneOf:
            - $ref: '#/components/schemas/Token'
            - type: 'null'
        categoryToken:
          oneOf:
            - $ref: '#/components/schemas/Token'
            - type: 'null'
        date:
          type:
            - string
            - 'null'
          format: date
        month:
          type:
            - string
            - 'null'
          description: Selected month filter as `YYYY-MM`, or null.
        week:
          type:
            - string
            - 'null'
          format: date
          description: Selected week start date, normalized to Monday, or null.
    StatsCategory:
      type: object
      additionalProperties: false
      required:
        - name
        - cents
        - sharePercent
      properties:
        name:
          type: string
        cents:
          type: integer
        sharePercent:
          type: number
    StatsTimelinePoint:
      type: object
      additionalProperties: false
      required:
        - start
        - end
        - cents
        - expenseCount
      properties:
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        cents:
          type: integer
        expenseCount:
          type: integer
          minimum: 0
    StatsMemberTotal:
      type: object
      additionalProperties: false
      required:
        - participantToken
        - name
        - cents
        - paidCents
        - shareCents
        - differenceCents
      properties:
        participantToken:
          $ref: '#/components/schemas/Token'
        name:
          type: string
        cents:
          type: integer
        paidCents:
          type: integer
        shareCents:
          type: integer
        differenceCents:
          type: integer
    StatsExpense:
      type: object
      additionalProperties: false
      required:
        - transactionToken
        - description
        - cents
        - date
        - categoryName
        - categoryEmoji
        - paidByName
        - paidByParticipantToken
        - outlier
      properties:
        transactionToken:
          oneOf:
            - $ref: '#/components/schemas/Token'
            - type: 'null'
          description: Public token of the underlying transaction; lets clients deep-link to the editor.
        description:
          type: string
        cents:
          type: integer
        date:
          type: string
          format: date
        categoryName:
          type: string
        categoryEmoji:
          type:
            - string
            - 'null'
          description: Resolved emoji for the category, matching the legend in the category filter.
        paidByName:
          type:
            - string
            - 'null'
        paidByParticipantToken:
          oneOf:
            - $ref: '#/components/schemas/Token'
            - type: 'null'
        outlier:
          type: boolean
    StatsDelta:
      type: object
      description: A period-over-period change in raw minor units.
      additionalProperties: false
      required:
        - direction
        - cents
        - percent
      properties:
        direction:
          type: string
          enum:
            - down
            - flat
            - up
        cents:
          type: integer
          description: Signed difference versus the previous period.
        percent:
          type:
            - number
            - 'null'
          description: Absolute percent change, or null when the previous period was zero.
    StatsDeltas:
      type: object
      description: Change versus the comparable previous period. Each delta is null when no comparison applies.
      additionalProperties: false
      required:
        - total
        - average
        - topCategory
      properties:
        total:
          oneOf:
            - $ref: '#/components/schemas/StatsDelta'
            - type: 'null'
        average:
          oneOf:
            - $ref: '#/components/schemas/StatsDelta'
            - type: 'null'
        topCategory:
          oneOf:
            - $ref: '#/components/schemas/StatsDelta'
            - type: 'null'
    GroupStats:
      type: object
      required:
        - currency
        - filters
        - totalSpendCents
        - transactionCount
        - averageExpenseCents
        - topCategory
        - categoryBreakdown
        - perPersonCents
        - perDayCents
        - spanDays
        - timelineGranularity
        - timeline
        - otherCurrencies
        - memberTotals
        - largestExpenses
        - deltas
      description: |
        Spending statistics for a group. All money values are raw minor units in the
        group currency — the client formats them. Expenses balanced in another
        currency (kept in their own currency, or waiting for a rate) are left out;
        `otherCurrencies` says whether any matched the filters.
      additionalProperties: false
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        filters:
          $ref: '#/components/schemas/StatsFilters'
        totalSpendCents:
          type: integer
        transactionCount:
          type: integer
          minimum: 0
        averageExpenseCents:
          type: integer
        topCategory:
          type:
            - object
            - 'null'
          additionalProperties: false
          properties:
            name:
              type: string
            cents:
              type: integer
            sharePercent:
              type: number
        categoryBreakdown:
          type: array
          items:
            $ref: '#/components/schemas/StatsCategory'
        perPersonCents:
          type: integer
          description: Total spend divided by the group's members.
        perDayCents:
          type: integer
          description: Total spend divided by `spanDays`.
        spanDays:
          type: integer
          minimum: 1
          description: Days in the timeline window — the selected period, starting no earlier than the group's first expense.
        timelineGranularity:
          type: string
          enum:
            - date
            - week
            - month
          description: Bucket size of `timeline`, picked from the length of the selected period.
        timeline:
          type: array
          description: |
            The spend-over-time chart: one bucket per day, week or month across the
            window, including empty ones. `start`/`end` are clipped to the window, so
            the first and last week of a period can be partial.
          items:
            $ref: '#/components/schemas/StatsTimelinePoint'
        otherCurrencies:
          type: boolean
          description: |
            `true` when expenses matching the filters balance in a currency other
            than the group's and so are missing from every figure here.
        memberTotals:
          type: array
          description: Every member's paid/share/difference totals in cents (full set, unpaginated).
          items:
            $ref: '#/components/schemas/StatsMemberTotal'
        largestExpenses:
          type: array
          description: |
            The biggest expenses in the filtered window (up to 5). Their names are
            in the request's language where a name is a default, for display only.
          items:
            $ref: '#/components/schemas/StatsExpense'
        deltas:
          $ref: '#/components/schemas/StatsDeltas'
    RecurringSplit:
      type: object
      additionalProperties: false
      required:
        - participantToken
      description: |
        Who shares each occurrence. `amountCents` is the share for `amount`
        splits, `percentage` for `percentage`, `shares` for `shares`; an
        `equal` split takes only the tokens.
      properties:
        participantToken:
          $ref: '#/components/schemas/Token'
        amountCents:
          type: integer
          minimum: 0
        percentage:
          type: number
          minimum: 0
          maximum: 100
        shares:
          type: integer
          minimum: 0
    RecurringCadence:
      type: string
      enum:
        - weekly
        - monthly
        - yearly
    RecurringExpense:
      type: object
      additionalProperties: false
      required:
        - token
        - description
        - amountCents
        - currency
        - categoryName
        - categoryToken
        - paidByParticipantToken
        - splitType
        - splits
        - cadence
        - interval
        - startsOn
        - nextOccursOn
        - paused
        - ownerName
        - createdAt
        - updatedAt
      description: |
        An expense wariwari posts on a schedule. It runs on the Pro of the member
        who set it up: while they don't have Pro or have left the group it is
        `paused`, occurrences are skipped, not queued, and it keeps moving so
        nothing piles up for later.
      properties:
        token:
          $ref: '#/components/schemas/Token'
        description:
          type: string
          minLength: 1
          maxLength: 120
        amountCents:
          type: integer
          minimum: 1
        currency:
          $ref: '#/components/schemas/Currency'
        categoryName:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 40
          description: The group category's name, for display. `null` when the schedule is filed under no category.
        categoryToken:
          oneOf:
            - $ref: '#/components/schemas/Token'
            - type: 'null'
        paidByParticipantToken:
          $ref: '#/components/schemas/Token'
        splitType:
          $ref: '#/components/schemas/SplitType'
        splits:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/RecurringSplit'
        cadence:
          $ref: '#/components/schemas/RecurringCadence'
        interval:
          type: integer
          minimum: 1
          description: Every `interval` weeks, months or years.
        startsOn:
          type: string
          format: date
        nextOccursOn:
          type: string
          format: date
        paused:
          type: boolean
          description: True while the member who set it up doesn't have Pro or has left the group.
        ownerName:
          type:
            - string
            - 'null'
          description: The name of the member who set it up, or `null` when they have left the group.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RecurringExpenseList:
      type: object
      additionalProperties: false
      required:
        - recurringExpenses
      properties:
        recurringExpenses:
          type: array
          items:
            $ref: '#/components/schemas/RecurringExpense'
    RecurringExpenseCreate:
      type: object
      additionalProperties: false
      required:
        - description
        - amountCents
        - currency
        - paidByParticipantToken
        - splitType
        - splits
        - cadence
        - startsOn
      properties:
        token:
          allOf:
            - $ref: '#/components/schemas/Token'
          description: Optional client-generated token. When absent the server generates one.
        description:
          type: string
          minLength: 1
          maxLength: 120
        amountCents:
          type: integer
          minimum: 1
        currency:
          $ref: '#/components/schemas/Currency'
        categoryToken:
          $ref: '#/components/schemas/Token'
        paidByParticipantToken:
          $ref: '#/components/schemas/Token'
        splitType:
          $ref: '#/components/schemas/SplitType'
        splits:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/RecurringSplit'
        cadence:
          $ref: '#/components/schemas/RecurringCadence'
        interval:
          type: integer
          minimum: 1
          default: 1
        startsOn:
          type: string
          format: date
    RecurringExpenseUpdate:
      type: object
      additionalProperties: false
      description: Send only the fields that change.
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 120
        amountCents:
          type: integer
          minimum: 1
        currency:
          $ref: '#/components/schemas/Currency'
        categoryToken:
          $ref: '#/components/schemas/Token'
        paidByParticipantToken:
          $ref: '#/components/schemas/Token'
        splitType:
          $ref: '#/components/schemas/SplitType'
        splits:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/RecurringSplit'
        cadence:
          $ref: '#/components/schemas/RecurringCadence'
        interval:
          type: integer
          minimum: 1
        startsOn:
          type: string
          format: date
    ParticipantMergeCreate:
      type: object
      additionalProperties: false
      required:
        - intoParticipantToken
      properties:
        intoParticipantToken:
          allOf:
            - $ref: '#/components/schemas/Token'
          description: Winner participant token.
    PositionMove:
      type: object
      additionalProperties: false
      required:
        - position
      description: Move to an absolute 1-based `position`. A position past the end of the list leaves it unchanged.
      properties:
        position:
          type: integer
          minimum: 1
    BalanceLedgerEntry:
      type: object
      additionalProperties: false
      required:
        - transactionToken
        - cents
        - amountCents
        - paidCents
        - shareCents
      description: |
        One transaction's part in a ledger line. `cents` is what it adds to the
        line; the other figures show how that comes out of the bill (for
        `paid_for_others`, `amountCents - shareCents`; for `paid_for_you`, the
        participant's `shareCents` of `amountCents`).
      properties:
        transactionToken:
          $ref: '#/components/schemas/Token'
        cents:
          type: integer
          description: What this transaction adds to its line, in the group currency's minor units.
        amountCents:
          type: integer
          description: The transaction's total in the group currency's minor units.
        paidCents:
          type: integer
          description: What the participant paid of this transaction.
        shareCents:
          type: integer
          description: The participant's share of this transaction.
    BalanceLedgerLine:
      type: object
      additionalProperties: false
      required:
        - key
        - totalCents
        - entries
      properties:
        key:
          type: string
          enum:
            - paid_for_others
            - paid_for_you
            - sent
            - received
          description: |
            `paid_for_others` — others' parts of bills the participant paid (adds).
            `paid_for_you` — the participant's part of bills someone else paid
            (subtracts). `sent` — payments the participant made (adds).
            `received` — payments the participant received (subtracts).
        totalCents:
          type: integer
          description: Sum of the entries' `cents`.
        entries:
          type: array
          description: Newest first, like the transaction list.
          items:
            $ref: '#/components/schemas/BalanceLedgerEntry'
    BalanceLedger:
      type: object
      additionalProperties: false
      required:
        - participantToken
        - currency
        - balanceCents
        - sharedTotalCents
        - otherCurrencies
        - lines
      description: |
        One participant's balance in the group currency, worked transaction by
        transaction. `balanceCents` equals
        `paid_for_others - paid_for_you + sent - received`, the same balance the
        group shows for this participant in `currency`.
      properties:
        participantToken:
          $ref: '#/components/schemas/Token'
        currency:
          $ref: '#/components/schemas/Currency'
        balanceCents:
          type: integer
          description: Signed balance. Positive means the participant is owed money.
        sharedTotalCents:
          type: integer
          description: Total of the bills listed under `paid_for_others` and `paid_for_you`.
        otherCurrencies:
          type: boolean
          description: |
            `true` when the participant also has transactions kept in another
            currency; those are balanced in their own currency and left out here.
        lines:
          type: array
          description: Always the four lines, in the order `paid_for_others`, `paid_for_you`, `sent`, `received`.
          minItems: 4
          maxItems: 4
          items:
            $ref: '#/components/schemas/BalanceLedgerLine'
    InvitationToken:
      type: string
      description: |
        Invitation token. 16 characters of base58; share it as a join link.
      minLength: 16
      maxLength: 16
      pattern: ^[A-HJ-NP-Za-km-z1-9]{16}$
      example: 4kPqR7sTuVwXyZa2
    Invitation:
      type: object
      required:
        - token
        - membershipRole
        - url
        - expiresAt
        - createdAt
      additionalProperties: false
      properties:
        token:
          $ref: '#/components/schemas/InvitationToken'
        membershipRole:
          $ref: '#/components/schemas/MembershipRole'
        url:
          type: string
          format: uri
          description: The link to share. Opening it while signed in joins the group with `membershipRole`.
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the invitation stops working. `null` for one that never expires. Expired and revoked invitations are not listed.
        createdAt:
          type: string
          format: date-time
    InvitationList:
      type: object
      additionalProperties: false
      required:
        - invitations
      description: Invitations that can still be used, newest first.
      properties:
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'
    InvitationCreate:
      type: object
      additionalProperties: false
      properties:
        membershipRole:
          $ref: '#/components/schemas/MembershipRole'
          description: Role granted to whoever accepts. Defaults to editor.
        expiresAt:
          type: string
          format: date-time
          description: When the invitation stops working; a time in the past is a 400. Omit for one that never expires.
    AccessRequestStatus:
      type: object
      additionalProperties: false
      required:
        - status
      description: |
        Where the signed-in user's own request to join a group stands. Carries
        nothing else about the group, so it is safe to show for a private group
        the user cannot open.
      properties:
        status:
          type: string
          enum:
            - none
            - pending
            - declined
            - viewable
          description: |
            `none` — no open request; the user may ask (a decline lapses after
            7 days and reads as `none`). `pending` — waiting for an admin.
            `declined` — an admin said no recently; asking again returns this
            until it lapses. `viewable` — the user can already open the group.
    AccessRequest:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - avatarUrl
        - createdAt
      description: A pending request from a signed-in user to join a private group.
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          description: The requester's display name.
        avatarUrl:
          type:
            - string
            - 'null'
          format: uri
          description: |
            Absolute link to the requester's avatar. `null` when they have none.
        createdAt:
          type: string
          format: date-time
    AccessRequestList:
      type: object
      additionalProperties: false
      required:
        - accessRequests
      description: Pending access requests, oldest first.
      properties:
        accessRequests:
          type: array
          items:
            $ref: '#/components/schemas/AccessRequest'
    NotificationPreferencesUpdate:
      type: object
      additionalProperties: false
      description: Partial update — only the events you send change; omitted events keep their value.
      properties:
        newExpense:
          type: boolean
        paymentReceived:
          type: boolean
        invitationAccepted:
          type: boolean
        accessRequested:
          type: boolean
        accessApproved:
          type: boolean
    AccountUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 120
        removeAvatar:
          type: boolean
        avatarColor:
          oneOf:
            - $ref: '#/components/schemas/Color'
            - type: 'null'
        preferredCurrency:
          $ref: '#/components/schemas/Currency'
        locale:
          $ref: '#/components/schemas/Locale'
        marketingOptIn:
          type: boolean
        notificationPreferences:
          $ref: '#/components/schemas/NotificationPreferencesUpdate'
    AccountAvatarUpload:
      type: object
      additionalProperties: false
      required:
        - avatar
      properties:
        avatar:
          type: string
          format: binary
          description: jpeg/png/gif/webp, ≤5MB.
    FeedbackCreate:
      type: object
      additionalProperties: false
      required:
        - body
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 4000
          description: The message. At most 5 links.
        email:
          type:
            - string
            - 'null'
          maxLength: 254
          description: |
            Reply address for an anonymous sender. Ignored when the caller is
            signed in; the account's email address is used instead.
  responses:
    BadRequest:
      description: |
        Bad Request. `VALIDATION_FAILED` when the body, a parameter or the record is invalid, with `errors` naming the fields; `INVALID_REQUEST` when the request is malformed, such as a bad cursor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: |
        `PAYLOAD_TOO_LARGE`: a JSON request body over 1 MiB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: |
        Too Many Requests. `RATE_LIMIT_EXCEEDED` means a short-term rate limit or a
        group's daily change limit was exceeded; retry after `Retry-After`. `QUOTA_EXCEEDED` means a developer API
        key on a metered plan used its monthly call quota; `Retry-After` says when it
        resets. Monthly quotas are off while full access is enabled.
      headers:
        Retry-After:
          description: |
            Seconds to wait before retrying: until the short-term window resets, the
            group's daily change window resets, the monthly quota resets, or (for email-change requests) the hourly window
            frees a slot.
          schema:
            type: integer
            minimum: 1
        RateLimit-Scope:
          description: |
            What the limit applies to. `group` means this group's daily change limit:
            only writes to this group need to wait, and other groups can continue.
            `client` means a limit on this caller (IP address, session or API key):
            every request should wait. Absent on `QUOTA_EXCEEDED`.
          schema:
            type: string
            enum:
              - group
              - client
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: |
        Internal Server Error (`INTERNAL_SERVER_EXCEPTION`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: |
        A service this operation needs is temporarily unavailable (`RATE_LIMIT_UNAVAILABLE`, `RATE_UNAVAILABLE`, `STORE_UNAVAILABLE`). Honor `Retry-After` when present.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: |
        Unauthorized. `AUTH_CREDENTIALS_REQUIRED` when no bearer token was sent; `AUTH_CREDENTIALS_INVALID` when it is malformed, expired or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: |
        Forbidden. `ACCESS_DENIED` when this caller may not reach the resource, `INSUFFICIENT_PERMISSIONS` when their role in the group doesn't allow the action, `PRO_REQUIRED` (with `upgradeUrl`) when it needs Pro.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: |
        Not Found (`NOT_FOUND`): the resource is missing or not visible to this caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: |
        Conflict. Check `code`:

        - `CONFLICT`: the `Expected-Revision` is stale; `current` holds the record as
          the server now has it.
        - `IDEMPOTENCY_KEY_IN_USE`: the `Idempotency-Key` was already used for a
          different request.
        - `IDEMPOTENCY_RECEIPT_EXPIRED`: the operation is older than receipt retention.
        - `DUPLICATE_TOKEN`: a create reused a resource token without replaying its
          `Idempotency-Key`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConflictProblem'
    StorageLimit:
      description: |
        `STORAGE_LIMIT`: the upload would take the uploader past their storage limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  parameters:
    PageTake:
      name: take
      in: query
      required: false
      description: How many items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    PageCursor:
      name: cursor
      in: query
      required: false
      description: The `pagination.cursor` of the previous page. Opaque; pass it back unchanged.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        A UUID naming this write. Send the same key and the same request again
        after a lost response and the server answers what it answered the first
        time, with `Idempotency-Replay: true`, without writing twice. The same key
        with a different method, path or body is `409 IDEMPOTENCY_KEY_IN_USE`.
        Receipts are kept for 90 days; an older retry is
        `409 IDEMPOTENCY_RECEIPT_EXPIRED`, and the client reconciles before
        writing again.
      schema:
        type: string
        format: uuid
    RecordedAt:
      name: Recorded-At
      in: header
      required: false
      description: |
        When the change was made on the client, as an ISO 8601 date-time with an
        offset (`2026-10-20T19:30:00+02:00`). Send it on writes queued offline.
        Activity rows record it as `recordedAt` and are ordered by it, an omitted
        `timeOfDay` (or payment `date`) is taken from it in its own offset, and a
        change recorded more than 12 hours before it reaches the server sends no
        push notification. A value more than 5 minutes in the future, or older
        than the 90-day receipt window, is ignored and server time is used instead;
        the write itself still goes through. A value that isn't a date-time with an
        offset is a 400.
      schema:
        type: string
        format: date-time
    GroupTokenAsParent:
      name: group_token
      in: path
      required: true
      description: Group token.
      schema:
        $ref: '#/components/schemas/GroupToken'
    ExpectedRevision:
      name: Expected-Revision
      in: header
      required: true
      description: |
        The `lockVersion` the client last saw on the record it is changing. A
        mismatch is `409 CONFLICT` with the record as the server now has it.
      schema:
        type: integer
        minimum: 0
    GroupCategoryToken:
      name: category_token
      in: path
      required: true
      description: Category token.
      schema:
        $ref: '#/components/schemas/Token'
    ParticipantToken:
      name: participant_token
      in: path
      required: true
      description: Participant token.
      schema:
        $ref: '#/components/schemas/Token'
    AttachmentId:
      name: attachment_id
      in: path
      required: true
      description: Attachment id, from the group's attachment list.
      schema:
        type: integer
        minimum: 1
    TransactionToken:
      name: transaction_token
      in: path
      required: true
      description: Transaction token.
      schema:
        $ref: '#/components/schemas/Token'
    RecurringExpenseToken:
      name: recurring_expense_token
      in: path
      required: true
      description: Recurring expense token.
      schema:
        $ref: '#/components/schemas/Token'
    InvitationToken:
      name: invitation_token
      in: path
      required: true
      description: Invitation token.
      schema:
        $ref: '#/components/schemas/InvitationToken'
    AccessRequestId:
      name: access_request_id
      in: path
      required: true
      description: The pending access request's id, from `listAccessRequests`.
      schema:
        type: integer
        minimum: 1
  headers:
    IdempotencyReplay:
      description: |
        `true` when this response is the stored answer to an earlier request with
        the same `Idempotency-Key`. Absent on a first answer.
      schema:
        type: string
        enum:
          - 'true'
    ReadModelVersion:
      description: |
        The group's `readModelVersion` as this response saw it, after the write when
        the request was one. Every successful response under a group carries it. A
        successful write moves the version by exactly 1, however many records it
        changes, and by 0 when it changed nothing (everything was already as asked,
        or the request replayed an `Idempotency-Key`). A client holding a snapshot
        at version N stays whole when its write answers N + 1 and it applies the
        returned resource, or answers N; any other value means something else
        changed, so read the group again.
      schema:
        type: integer
        minimum: 0
x-tagGroups:
  - name: Account
    tags:
      - account
      - feedback
  - name: Groups
    tags:
      - groups
      - search
  - name: Group Resources
    tags:
      - participants
      - categories
      - transactions
      - attachments
      - recurring_expenses
      - invitations
      - access_requests
      - imports
