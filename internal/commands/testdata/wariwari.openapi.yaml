  /v1/groups/{group_token}/participants/{participant_token}/balance:
    parameters:
      - $ref: '#/components/parameters/GroupTokenAsParent'
      - $ref: '#/components/parameters/ParticipantToken'
    get:
      security:
        - {}
        - bearerAuth: []
      tags:
        - participants
      operationId: showParticipantBalance
      summary: Show a participant's balance ledger
      description: |
        Works out one participant's balance in the group currency, transaction
        by transaction, for any viewable group. Entries reference transactions
        by token; read their details from the group snapshot.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceLedger'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
