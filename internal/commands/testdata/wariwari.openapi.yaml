        - {}
        - bearerAuth: []
      tags:
        - transactions
      operationId: deleteTransaction
      x-wariwari-heavy-ok: Group writes return the refreshed canonical snapshot.
      summary: Delete a transaction
      description: |
        Soft-deletes a transaction and returns the refreshed group snapshot.
