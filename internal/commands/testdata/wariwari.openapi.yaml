      x-wariwari-heavy-ok: Group writes return the refreshed canonical snapshot.
      summary: Update a transaction
      description: |
        Updates an existing transaction and returns the refreshed group snapshot.
        Requires the latest `lockVersion`. Sending `splits` replaces all existing
        splits. A deleted transaction returns `CONFLICT` with `current` carrying
        its `deletedAt`, even when `lockVersion` matches.
