            format: date
            example: '2026-01-01'
        - name: to
          in: query
          required: false
          description: Only transactions dated on or before this date.
          schema:
            type: string
            format: date
            example: '2026-01-31'
        - name: categoryToken
          in: query
          required: false
          description: Only transactions filed under this group category.
          schema:
            $ref: '#/components/schemas/Token'
        - name: participantToken
          in: query
          required: false
          description: Only transactions this participant paid for or owes a share of.
          schema:
