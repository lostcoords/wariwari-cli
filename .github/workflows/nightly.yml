name: Nightly
# Every main commit that passes Test replaces the `nightly` prerelease.
# Tagged releases come from release.yml; releases/latest never points here.
on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  nightly:
    # workflow_run's branch filter matches a fork PR's branch named main too, so
    # only build pushes to this repository.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --snapshot --clean
      - name: Replace the nightly prerelease
        run: |
          version=$(sed -n 's/.*  wariwari_\(.*\)_linux_amd64\.tar\.gz$/\1/p' dist/checksums.txt)
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly dist/*.tar.gz dist/*.zip dist/checksums.txt \
            --target "$SHA" --prerelease --latest=false --title "Nightly ($version)" \
            --notes "wariwari $version, built from $SHA. Install: curl -fsSL https://wariwari.jp/install.sh | WARIWARI_VERSION=nightly sh — or wariwari upgrade --version nightly"
